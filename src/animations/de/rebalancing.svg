<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" role="img" aria-label="Animation: ein Portfolio von € 100.000 mit € 60.000 in Aktien und € 40.000 in Anleihen; Aktien steigen um 25 % auf € 75.000, die Mischung driftet auf 65 % Aktien; der Verkauf von € 6.000 Aktien und Kauf von € 6.000 Anleihen stellt 60/40 mit € 69.000 und € 46.000 wieder her" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-rebalancing"><title>Animation: ein Portfolio von € 100.000 mit € 60.000 in Aktien und € 40.000 in Anleihen; Aktien steigen um 25 % auf € 75.000, die Mischung driftet auf 65 % Aktien; der Verkauf von € 6.000 Aktien und Kauf von € 6.000 Anleihen stellt 60/40 mit € 69.000 und € 46.000 wieder her</title><style>.rb-sh{transform-box:fill-box;transform-origin:50% 100%}@keyframes rb-sh{0%,7.5%{transform:scaleY(0.87)}30%,57.5%{transform:scaleY(1.09)}77.5%,100%{transform:scaleY(1)}}@keyframes rb-bo{0%,57.5%{transform:scaleY(0.87)}77.5%,100%{transform:scaleY(1)}}@keyframes rb-chip{0%,55%{transform:translate(0,-14.4px);opacity:0}57.5%{opacity:1;transform:translate(0,-14.4px)}75%{opacity:1;transform:translate(180px,-14.4px)}78.75%,100%{opacity:0;transform:translate(180px,-14.4px)}}.rb-chip{opacity:0}.anim-armed .rb-shares{animation:rb-sh 8s ease-in-out both}.anim-armed .rb-bonds{animation:rb-bo 8s ease-in-out both}.anim-armed .rb-chip{animation:rb-chip 8s ease-in-out both}@keyframes rb-s1{0%,0%{opacity:1}0.13%{opacity:1}30%{opacity:1}30.12%,100%{opacity:0}}.rb-s1{opacity:0}.anim-armed .rb-s1{animation:rb-s1 8s linear both}@keyframes rb-s2{0%,30%{opacity:0}30.12%{opacity:1}77.5%{opacity:1}77.63%,100%{opacity:0}}.rb-s2{opacity:0}.anim-armed .rb-s2{animation:rb-s2 8s linear both}@keyframes rb-s3{0%,77.5%{opacity:0}81.25%,100%{opacity:1}}.anim-armed .rb-s3{animation:rb-s3 8s linear both}</style><rect width="740" height="340" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Eine 