<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Animation: Eine Market-Order über 500 Aktien nimmt zuerst alle 200 Aktien zu € 20,02, dann die 300 zu € 20,10; sie kostet insgesamt € 10.034, rund € 20,07 je Aktie statt des letzten Preises von € 20,00, also rund € 34 Slippage" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-market-order-fill"><title>Animation: Eine Market-Order über 500 Aktien nimmt zuerst alle 200 Aktien zu € 20,02, dann die 300 zu € 20,10; sie kostet insgesamt € 10.034, rund € 20,07 je Aktie statt des letzten Preises von € 20,00, also rund € 34 Slippage</title><style>.mo-shrink{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)}@keyframes mo-pill{0%{transform:translateY(24px);opacity:0}15%,100%{transform:translateY(0);opacity:1}}@keyframes mo-a{0%,20%{transform:scaleX(1)}37.5%,100%{transform:scaleX(0)}}@keyframes mo-b{0%,41.25%{transform:scaleX(1)}62.5%,100%{transform:scaleX(0)}}@keyframes mo-t1{0%,41.15%{opacity:1}41.25%,100%{opacity:0}}@keyframes mo-t2{0%,41.15%{opacity:0}41.25%,64.9%{opacity:1}65%,100%{opacity:0}}.mo-t1,.mo-t2{opacity:0}@keyframes mo-f1{0%,37.4%{opacity:0}40.5%,100%{opacity:1}}@keyframes mo-f2{0%,62.4%{opacity:0}65.5%,100%{opacity:1}}@keyframes mo-f3{0%,69.9%{opacity:0}73%,100%{opacity:1}}@keyframes mo-done{0%,64.9%{opacity:0}68%,100%{opacity:1}}.anim-armed .mo-pill{animation:mo-pill 8s ease-out both}.anim-armed .mo-a{animation:mo-a 8s linear both}.anim-armed .mo-b{animation:mo-b 8s linear both}.anim-armed .mo-t1{animation:mo-t1 8s linear both}.anim-armed .mo-t2{animation:mo-t2 8s linear both}.anim-armed .mo-f1{animation:mo-f1 8s linear both}.anim-armed .mo-f2{animation:mo-f2 8s linear both}.anim-armed .mo-f3{animation:mo-f3 8s linear both}.anim-armed .mo-done{animation:mo-done 8s linear both}</style><rect width="720" height="300" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Eine Market-Order über 500 Aktien</text><text x="40" y="66" font-size="13" font-weight="600" fill="#4D5470" text-anchor="start">Verkäufer im Orderbuch</text><rect x="40" y="80" width="300" height="44" rx="8" fill="#F3EEF8" stroke="#C8B8DB"/><text x="56" y="108" font-size="15" font-weight="700" fill="#0B132B" text-anchor="start">€ 20,10</text><rect x="140" y="92" width="144" height="20" rx="4" fill="none" stroke="#C8B8DB" stroke-dasharray="3 3"/><rect class="mo-shrink mo-b" x="140" y="92" width="144" height="20" rx="4" fill="#6A55A0"/><text x="294" y="107" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">300 Aktien</text><rect x="40" y="136" width="300" height="44" rx="8" fill="#F3EEF8" stroke="#C8B8DB"/><text x="56" y="164" font-size="15" font-weight="700" fill="#0B132B" text-anchor="start">€ 20,02</text><rect x="140" y="148" width="96" height="20" rx="4" fill="none" stroke="#C8B8DB" stroke-dasharray="3 3"/><rect class="mo-shrink mo-a" x="140" y="148" width="96" height="20" rx="4" fill="#6A55A0"/><text x="246" y="163" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">200 Aktien</text><line x1="40" x2="340" y1="212" y2="212" stroke="#0B132B" stroke-width="2" stroke-dasharray="5 4"/><text x="40" y="232" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Letzter Preis am Bildschirm: € 20,00</text><g class="mo-pill"><rect x="40" y="250" width="300" height="34" rx="17" fill="#0B132B"/><text x="190" y="272" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mo-t1">500 kaufen, bestens</text><text x="190" y="272" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mo-t2">noch 300 zu kaufen</text><text x="190" y="272" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mo-done">Ausgeführt: 500 Aktien</text></g><rect x="400" y="80" width="290" height="190" rx="10" fill="#ffffff" stroke="#C8B8DB"/><text x="418" y="106" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Was du zahlst</text><text x="418" y="136" font-size="13" font-weight="500" fill="#0B132B" text-anchor="start" class="mo-f1">200 × € 20,02 = € 4.004</text><text x="418" y="162" font-size="13" font-weight="500" fill="#0B132B" text-anchor="start" class="mo-f2">300 × € 20,10 = € 6.030</text><g class="mo-f3"><line x1="418" x2="672" y1="176" y2="176" stroke="#e3e8ee"/><text x="418" y="198" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Gesamt € 10.034 · rund € 20,07 je Aktie</text><text x="418" y="224" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Erwartet zu € 20,00: € 10.000</text><text x="418" y="248" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">Slippage: rund € 34</text></g></svg>
