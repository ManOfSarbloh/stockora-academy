<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Animation: € 100 im Monat kaufen 2 Anteile zu € 50, 2,5 zu € 40, 4 zu € 25 und 2 zu € 50: 10,5 Anteile für € 400, Durchschnittskosten von rund € 38,10 gegenüber einem Durchschnittspreis von € 41,25; bei € 50 ist der Bestand € 525 wert" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-cost-average"><title>Animation: € 100 im Monat kaufen 2 Anteile zu € 50, 2,5 zu € 40, 4 zu € 25 und 2 zu € 50: 10,5 Anteile für € 400, Durchschnittskosten von rund € 38,10 gegenüber einem Durchschnittspreis von € 41,25; bei € 50 ist der Bestand € 525 wert</title><style>.ca-bar{transform-box:fill-box;transform-origin:50% 100%}@keyframes ca-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes ca-fade{from{opacity:0}to{opacity:1}}.anim-armed .ca-bar{animation:ca-grow .5s ease-out both}.anim-armed .ca-f{animation:ca-fade .45s ease-out both}</style><rect width="760" height="360" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Jeden Monat € 100, egal wie der Kurs steht</text><text x="40" y="66" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="start">Preis je Anteil</text><rect class="ca-bar" style="animation-delay:0.3s" x="60" y="120" width="56" height="180" rx="5" fill="#C8B8DB"/><g class="ca-f" style="animation-delay:0.6s"><text x="88" y="112" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">€ 50</text></g><text x="88" y="320" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">Monat 1</text><g class="ca-f" style="animation-delay:0.9s"><rect x="68" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="79" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="90" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="101" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><text x="88" y="338" font-size="12" font-weight="700" fill="#6A55A0" text-anchor="middle">2,00 Anteile</text></g><rect class="ca-bar" style="animation-delay:1.6s" x="160" y="156" width="56" height="144" rx="5" fill="#C8B8DB"/><g class="ca-f" style="animation-delay:1.9s"><text x="188" y="148" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">€ 40</text></g><text x="188" y="320" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">Monat 2</text><g class="ca-f" style="animation-delay:2.2s"><rect x="168" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="179" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="190" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="201" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="168" y="272" width="9" height="9" rx="2" fill="#6A55A0"/><text x="188" y="338" font-size="12" font-weight="700" fill="#6A55A0" text-anchor="middle">2,50 Anteile</text></g><rect class="ca-bar" style="animation-delay:2.9s" x="260" y="210" width="56" height="90" rx="5" fill="#C8B8DB"/><g class="ca-f" style="animation-delay:3.2s"><text x="288" y="202" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">€ 25</text></g><text x="288" y="320" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">Monat 3</text><g class="ca-f" style="animation-delay:3.5s"><rect x="268" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="279" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="290" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="301" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="268" y="272" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="279" y="272" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="290" y="272" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="301" y="272" width="9" height="9" rx="2" fill="#6A55A0"/><text x="288" y="338" font-size="12" font-weight="700" fill="#6A55A0" text-anchor="middle">4,00 Anteile</text></g><rect class="ca-bar" style="animation-delay:4.2s" x="360" y="120" width="56" height="180" rx="5" fill="#C8B8DB"/><g class="ca-f" style="animation-delay:4.5s"><text x="388" y="112" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">€ 50</text></g><text x="388" y="320" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">Monat 4</text><g class="ca-f" style="animation-delay:4.8s"><rect x="368" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="379" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="390" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><rect x="401" y="284" width="9" height="9" rx="2" fill="#6A55A0"/><text x="388" y="338" font-size="12" font-weight="700" fill="#6A55A0" text-anchor="middle">2,00 Anteile</text></g><rect x="470" y="60" width="260" height="250" rx="12" fill="#ffffff" stroke="#C8B8DB"/><text x="488" y="88" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Nach vier Monaten</text><g class="ca-f" style="animation-delay:5.2s"><text x="488" y="120" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Investiert</text><text x="712" y="120" font-size="13.5" font-weight="700" fill="#0B132B" text-anchor="end">€ 400</text></g><g class="ca-f" style="animation-delay:5.4s"><text x="488" y="146" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Gekaufte Anteile</text><text x="712" y="146" font-size="13.5" font-weight="700" fill="#0B132B" text-anchor="end">10,50</text></g><g class="ca-f" style="animation-delay:5.7s"><text x="488" y="182" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Ø-Kosten je Anteil</text><text x="712" y="182" font-size="14.5" font-weight="700" fill="#6A55A0" text-anchor="end">≈ € 38,10</text></g><g class="ca-f" style="animation-delay:6s"><text x="488" y="208" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Durchschnitt der vier Preise</text><text x="712" y="208" font-size="13.5" font-weight="700" fill="#0B132B" text-anchor="end">€ 41,25</text></g><g class="ca-f" style="animation-delay:6.4s"><line x1="488" x2="712" y1="226" y2="226" stroke="#e3e8ee"/><text x="488" y="252" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Wert bei € 50: 10,5 × € 50 = € 525</text><text x="488" y="276" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">ein Gewinn von 31 %, obwohl der Kurs</text><text x="488" y="293" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">nur zum Ausgangswert zurückkehrte</text></g></svg>
