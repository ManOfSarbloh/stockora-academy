<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" role="img" aria-label="Animation: a €100,000 portfolio with €60,000 in shares and €40,000 in bonds; shares rise 25% to €75,000, so the mix drifts to 65% shares; selling €6,000 of shares and buying €6,000 of bonds restores 60/40 with €69,000 and €46,000" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-rebalancing"><title>Animation: a €100,000 portfolio with €60,000 in shares and €40,000 in bonds; shares rise 25% to €75,000, so the mix drifts to 65% shares; selling €6,000 of shares and buying €6,000 of bonds restores 60/40 with €69,000 and €46,000</title><style>.rb-sh{transform-box:fill-box;transform-origin:50% 100%}@keyframes rb-sh{0%,7.5%{transform:scaleY(0.87)}30%,57.5%{transform:scaleY(1.09)}77.5%,100%{transform:scaleY(1)}}@keyframes rb-bo{0%,57.5%{transform:scaleY(0.87)}77.5%,100%{transform:scaleY(1)}}@keyframes rb-chip{0%,55%{transform:translate(0,-14.4px);opacity:0}57.5%{opacity:1;transform:translate(0,-14.4px)}75%{opacity:1;transform:translate(180px,-14.4px)}78.75%,100%{opacity:0;transform:translate(180px,-14.4px)}}.rb-chip{opacity:0}.anim-armed .rb-shares{animation:rb-sh 8s ease-in-out both}.anim-armed .rb-bonds{animation:rb-bo 8s ease-in-out both}.anim-armed .rb-chip{animation:rb-chip 8s ease-in-out both}@keyframes rb-s1{0%,0%{opacity:1}0.13%{opacity:1}30%{opacity:1}30.12%,100%{opacity:0}}.rb-s1{opacity:0}.anim-armed .rb-s1{animation:rb-s1 8s linear both}@keyframes rb-s2{0%,30%{opacity:0}30.12%{opacity:1}77.5%{opacity:1}77.63%,100%{opacity:0}}.rb-s2{opacity:0}.anim-armed .rb-s2{animation:rb-s2 8s linear both}@keyframes rb-s3{0%,77.5%{opacity:0}81.25%,100%{opacity:1}}.anim-armed .rb-s3{animation:rb-s3 8s linear both}</style><rect width="740" height="340" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">Rebalancing a 60/40 mix after a good year for shares</text><line x1="80" x2="420" y1="270" y2="270" stroke="#1a2433" stroke-width="1.5"/><rect class="rb-sh rb-shares" x="120" y="104.4" width="90" height="165.6" rx="6" fill="#0F2A44"/><rect class="rb-sh rb-bonds" x="300" y="159.60000000000002" width="90" height="110.39999999999999" rx="6" fill="#9FB7C9"/><g class="rb-chip"><rect x="130" y="90" width="70" height="31.68" rx="5" fill="#c98500"/><text x="165" y="112" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">€6,000</text></g><text x="165" y="292" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">Shares</text><text x="345" y="292" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">Bonds</text><g class="rb-s1"><rect x="450" y="70" width="270" height="170" rx="12" fill="#ffffff" stroke="#9FB7C9"/><text x="468" y="100" font-size="13" font-weight="700" fill="#1a2433" text-anchor="start">Start: €100,000</text><text x="468" y="126" font-size="13" font-weight="500" fill="#1a2433" text-anchor="start">Shares €60,000 · bonds €40,000</text><text x="468" y="152" font-size="13" font-weight="700" fill="#0F2A44" text-anchor="start">Mix: 60% shares</text></g><g class="rb-s2"><rect x="450" y="70" width="270" height="170" rx="12" fill="#ffffff" stroke="#9FB7C9"/><text x="468" y="100" font-size="13" font-weight="700" fill="#1a2433" text-anchor="start">Shares rise 25%, bonds stay flat</text><text x="468" y="126" font-size="13" font-weight="500" fill="#1a2433" text-anchor="start">Shares €75,000 · bonds €40,000</text><text x="468" y="152" font-size="13" font-weight="500" fill="#1a2433" text-anchor="start">Total €115,000</text><text x="468" y="178" font-size="13" font-weight="700" fill="#c98500" text-anchor="start">Mix: 75 ÷ 115 = 65% shares</text></g><g class="rb-s3"><rect x="450" y="70" width="270" height="170" rx="12" fill="#ffffff" stroke="#9FB7C9"/><text x="468" y="100" font-size="13" font-weight="700" fill="#1a2433" text-anchor="start">Back to 60/40</text><text x="468" y="126" font-size="12.5" font-weight="500" fill="#1a2433" text-anchor="start">Target: 0.60 × €115,000 = €69,000</text><text x="468" y="152" font-size="12.5" font-weight="500" fill="#1a2433" text-anchor="start">Sell €6,000 shares, buy €6,000 bonds</text><text x="468" y="178" font-size="13" font-weight="500" fill="#1a2433" text-anchor="start">Shares €69,000 · bonds €46,000</text><text x="468" y="204" font-size="13" font-weight="700" fill="#16834a" text-anchor="start">Mix: 60% shares again</text></g></svg>
