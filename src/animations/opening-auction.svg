<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Animation: buy and sell orders collected for an opening auction; at €20.20 300 shares could trade, at €20.10 700, at €20.00 800 and at €19.90 400, so the auction price is €20.00 and 800 shares trade at that single price" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-opening-auction"><title>Animation: buy and sell orders collected for an opening auction; at €20.20 300 shares could trade, at €20.10 700, at €20.00 800 and at €19.90 400, so the auction price is €20.00 and 800 shares trade at that single price</title><style>.oa-bar{transform-box:fill-box}.oa-buy{transform-origin:100% 50%}.oa-sell{transform-origin:0 50%}@keyframes oa-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes oa-fade{from{opacity:0}to{opacity:1}}@keyframes oa-dim{from{opacity:1}to{opacity:.4}}.oa-dim{opacity:.4}.anim-armed .oa-bar{animation:oa-grow .7s ease-out both}.anim-armed .oa-can{animation:oa-fade .4s ease-out both}.anim-armed .oa-dim{animation:oa-dim .5s ease-out both;animation-delay:6.2s}.anim-armed .oa-win{animation:oa-fade .5s ease-out both;animation-delay:6.2s}.anim-armed .oa-badge{animation:oa-fade .5s ease-out both;animation-delay:6.8s}.anim-armed .oa-end{animation:oa-fade .1s linear both;animation-delay:8.9s}</style><rect width="720" height="360" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">An opening auction: one price for everyone</text><text x="300" y="78" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="end">Buyers would buy</text><text x="370" y="78" font-size="12.5" font-weight="700" fill="#516075" text-anchor="middle">Price</text><text x="440" y="78" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">Sellers would sell</text><g class="oa-dim"><rect class="oa-bar oa-buy" style="animation-delay:0.3s" x="255" y="100" width="45" height="20" rx="4" fill="#16834a"/><text x="249" y="115" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="end">300</text><rect class="oa-bar oa-sell" style="animation-delay:0.3s" x="440" y="100" width="225" height="20" rx="4" fill="#c8352f"/><text x="671" y="115" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">1,500</text><text x="370" y="115" font-size="14" font-weight="700" fill="#1a2433" text-anchor="middle">€20.20</text><g class="oa-can" style="animation-delay:3.6s"><text x="370" y="136" font-size="11.5" font-weight="600" fill="#516075" text-anchor="middle">could trade 300</text></g></g><g class="oa-dim"><rect class="oa-bar oa-buy" style="animation-delay:0.75s" x="195" y="156" width="105" height="20" rx="4" fill="#16834a"/><text x="189" y="171" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="end">700</text><rect class="oa-bar oa-sell" style="animation-delay:0.75s" x="440" y="156" width="150" height="20" rx="4" fill="#c8352f"/><text x="596" y="171" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">1,000</text><text x="370" y="171" font-size="14" font-weight="700" fill="#1a2433" text-anchor="middle">€20.10</text><g class="oa-can" style="animation-delay:4.1s"><text x="370" y="192" font-size="11.5" font-weight="600" fill="#516075" text-anchor="middle">could trade 700</text></g></g><g><rect class="oa-bar oa-buy" style="animation-delay:1.2s" x="150" y="212" width="150" height="20" rx="4" fill="#16834a"/><text x="144" y="227" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="end">1,000</text><rect class="oa-bar oa-sell" style="animation-delay:1.2s" x="440" y="212" width="120" height="20" rx="4" fill="#c8352f"/><text x="566" y="227" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">800</text><text x="370" y="227" font-size="14" font-weight="700" fill="#1a2433" text-anchor="middle">€20.00</text><g class="oa-can" style="animation-delay:4.6s"><text x="370" y="248" font-size="11.5" font-weight="600" fill="#516075" text-anchor="middle">could trade 800</text></g></g><g class="oa-dim"><rect class="oa-bar oa-buy" style="animation-delay:1.65s" x="60" y="268" width="240" height="20" rx="4" fill="#16834a"/><text x="54" y="283" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="end">1,600</text><rect class="oa-bar oa-sell" style="animation-delay:1.65s" x="440" y="268" width="60" height="20" rx="4" fill="#c8352f"/><text x="506" y="283" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">400</text><text x="370" y="283" font-size="14" font-weight="700" fill="#1a2433" text-anchor="middle">€19.90</text><g class="oa-can" style="animation-delay:5.1s"><text x="370" y="304" font-size="11.5" font-weight="600" fill="#516075" text-anchor="middle">could trade 400</text></g></g><rect class="oa-win" x="304" y="204" width="132" height="52" rx="10" fill="none" stroke="#0E9F9A" stroke-width="2.5"/><g class="oa-badge"><rect x="160" y="318" width="400" height="40" rx="20" fill="#0F2A44"/><text x="360" y="343" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Auction price €20.00: 800 shares trade at one price</text></g><g class="oa-end"></g></svg>
