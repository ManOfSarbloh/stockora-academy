<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Animation: €100 a month buys 2 units at €50, 2.5 at €40, 4 at €25 and 2 at €50: 10.5 units for €400, an average cost of about €38.10 against an average price of €41.25; at €50 the holding is worth €525" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-cost-average"><title>Animation: €100 a month buys 2 units at €50, 2.5 at €40, 4 at €25 and 2 at €50: 10.5 units for €400, an average cost of about €38.10 against an average price of €41.25; at €50 the holding is worth €525</title><style>.ca-bar{transform-box:fill-box;transform-origin:50% 100%}@keyframes ca-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes ca-fade{from{opacity:0}to{opacity:1}}.anim-armed .ca-bar{animation:ca-grow .5s ease-out both}.anim-armed .ca-f{animation:ca-fade .45s ease-out both}</style><rect width="760" height="360" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">€100 every month, whatever the price</text><text x="40" y="66" font-size="12.5" font-weight="600" fill="#516075" text-anchor="start">Price per unit</text><rect class="ca-bar" style="animation-delay:0.3s" x="60" y="120" width="56" height="180" rx="5" fill="#9FB7C9"/><g class="ca-f" style="animation-delay:0.6s"><text x="88" y="112" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">€50</text></g><text x="88" y="320" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">Month 1</text><g class="ca-f" style="animation-delay:0.9s"><rect x="68" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="79" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="90" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="101" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><text x="88" y="338" font-size="12" font-weight="700" fill="#0E9F9A" text-anchor="middle">2.00 units</text></g><rect class="ca-bar" style="animation-delay:1.6s" x="160" y="156" width="56" height="144" rx="5" fill="#9FB7C9"/><g class="ca-f" style="animation-delay:1.9s"><text x="188" y="148" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">€40</text></g><text x="188" y="320" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">Month 2</text><g class="ca-f" style="animation-delay:2.2s"><rect x="168" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="179" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="190" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="201" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="168" y="272" width="9" height="9" rx="2" fill="#0E9F9A"/><text x="188" y="338" font-size="12" font-weight="700" fill="#0E9F9A" text-anchor="middle">2.50 units</text></g><rect class="ca-bar" style="animation-delay:2.9s" x="260" y="210" width="56" height="90" rx="5" fill="#9FB7C9"/><g class="ca-f" style="animation-delay:3.2s"><text x="288" y="202" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">€25</text></g><text x="288" y="320" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">Month 3</text><g class="ca-f" style="animation-delay:3.5s"><rect x="268" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="279" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="290" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="301" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="268" y="272" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="279" y="272" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="290" y="272" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="301" y="272" width="9" height="9" rx="2" fill="#0E9F9A"/><text x="288" y="338" font-size="12" font-weight="700" fill="#0E9F9A" text-anchor="middle">4.00 units</text></g><rect class="ca-bar" style="animation-delay:4.2s" x="360" y="120" width="56" height="180" rx="5" fill="#9FB7C9"/><g class="ca-f" style="animation-delay:4.5s"><text x="388" y="112" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">€50</text></g><text x="388" y="320" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">Month 4</text><g class="ca-f" style="animation-delay:4.8s"><rect x="368" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="379" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="390" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><rect x="401" y="284" width="9" height="9" rx="2" fill="#0E9F9A"/><text x="388" y="338" font-size="12" font-weight="700" fill="#0E9F9A" text-anchor="middle">2.00 units</text></g><rect x="470" y="60" width="260" height="250" rx="12" fill="#ffffff" stroke="#9FB7C9"/><text x="488" y="88" font-size="13" font-weight="700" fill="#1a2433" text-anchor="start">After four months</text><g class="ca-f" style="animation-delay:5.2s"><text x="488" y="120" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Invested</text><text x="712" y="120" font-size="13.5" font-weight="700" fill="#1a2433" text-anchor="end">€400</text></g><g class="ca-f" style="animation-delay:5.4s"><text x="488" y="146" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Units bought</text><text x="712" y="146" font-size="13.5" font-weight="700" fill="#1a2433" text-anchor="end">10.50</text></g><g class="ca-f" style="animation-delay:5.7s"><text x="488" y="182" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Average cost per unit</text><text x="712" y="182" font-size="14.5" font-weight="700" fill="#0E9F9A" text-anchor="end">≈ €38.10</text></g><g class="ca-f" style="animation-delay:6s"><text x="488" y="208" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Average of the four prices</text><text x="712" y="208" font-size="13.5" font-weight="700" fill="#1a2433" text-anchor="end">€41.25</text></g><g class="ca-f" style="animation-delay:6.4s"><line x1="488" x2="712" y1="226" y2="226" stroke="#e3e8ee"/><text x="488" y="252" font-size="13" font-weight="700" fill="#1a2433" text-anchor="start">Worth at €50: 10.5 × €50 = €525</text><text x="488" y="276" font-size="12" font-weight="500" fill="#516075" text-anchor="start">a gain of 31%, although the price only</text><text x="488" y="293" font-size="12" font-weight="500" fill="#516075" text-anchor="start">returned to where it started</text></g></svg>
