<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" role="img" aria-label="Animation : un portefeuille de 100 000 € avec 60 000 € en actions et 40 000 € en obligations ; les actions montent de 25 % à 75 000 €, le mélange dérive à 65 % d’actions ; vendre 6 000 € d’actions et acheter 6 000 € d’obligations rétablit 60/40 avec 69 000 € et 46 000 €" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-rebalancing"><title>Animation : un portefeuille de 100 000 € avec 60 000 € en actions et 40 000 € en obligations ; les actions montent de 25 % à 75 000 €, le mélange dérive à 65 % d’actions ; vendre 6 000 € d’actions et acheter 6 000 € d’obligations rétablit 60/40 avec 69 000 € et 46 000 €</title><style>.rb-sh{transform-box:fill-box;transform-origin:50% 100%}@keyframes rb-sh{0%,7.5%{transform:scaleY(0.87)}30%,57.5%{transform:scaleY(1.09)}77.5%,100%{transform:scaleY(1)}}@keyframes rb-bo{0%,57.5%{transform:scaleY(0.87)}77.5%,100%{transform:scaleY(1)}}@keyframes rb-chip{0%,55%{transform:translate(0,-14.4px);opacity:0}57.5%{opacity:1;transform:translate(0,-14.4px)}75%{opacity:1;transform:translate(180px,-14.4px)}78.75%,100%{opacity:0;transform:translate(180px,-14.4px)}}.rb-chip{opacity:0}.anim-armed .rb-shares{animation:rb-sh 8s ease-in-out both}.anim-armed .rb-bonds{animation:rb-bo 8s ease-in-out both}.anim-armed .rb-chip{animation:rb-chip 8s ease-in-out both}@keyframes rb-s1{0%,0%{opacity:1}0.13%{opacity:1}30%{opacity:1}30.12%,100%{opacity:0}}.rb-s1{opacity:0}.anim-armed .rb-s1{animation:rb-s1 8s linear both}@keyframes rb-s2{0%,30%{opacity:0}30.12%{opacity:1}77.5%{opacity:1}77.63%,100%{opacity:0}}.rb-s2{opacity:0}.anim-armed .rb-s2{animation:rb-s2 8s linear both}@keyframes rb-s3{0%,77.5%{opacity:0}81.25%,100%{opacity:1}}.anim-armed .rb-s3{animation:rb-s3 8s linear both}</style><rect width="740" height="340" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Rééquilibrer un mélange 60/40 après une bonne année</text><line x1="80" x2="420" y1="270" y2="270" stroke="#0B132B" stroke-width="1.5"/><rect class="rb-sh rb-shares" x="120" y="104.4" width="90" height="165.6" rx="6" fill="#0B132B"/><rect class="rb-sh rb-bonds" x="300" y="159.60000000000002" width="90" height="110.39999999999999" rx="6" fill="#C8B8DB"/><g class="rb-chip"><rect x="130" y="90" width="70" height="31.68" rx="5" fill="#c98500"/><text x="165" y="112" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6 000 €</text></g><text x="165" y="292" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Actions</text><text x="345" y="292" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Obligations</text><g class="rb-s1"><rect x="450" y="70" width="270" height="170" rx="12" fill="#ffffff" stroke="#C8B8DB"/><text x="468" y="100" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Départ : 100 000 €</text><text x="468" y="126" font-size="13" font-weight="500" fill="#0B132B" text-anchor="start">Actions 60 000 € · obligations 40 000 €</text><text x="468" y="152" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Mix : 60 % d’actions</text></g><g class="rb-s2"><rect x="450" y="70" width="270" height="170" rx="12" fill="#ffffff" stroke="#C8B8DB"/><text x="468" y="100" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Actions +25 %, obligations stables</text><text x="468" y="126" font-size="13" font-weight="500" fill="#0B132B" text-anchor="start">Actions 75 000 € · obligations 40 000 €</text><text x="468" y="152" font-size="13" font-weight="500" fill="#0B132B" text-anchor="start">Total 115 000 €</text><text x="468" y="178" font-size="13" font-weight="700" fill="#c98500" text-anchor="start">Mix : 75 ÷ 115 = 65 % d’actions</text></g><g class="rb-s3"><rect x="450" y="70" width="270" height="170" rx="12" fill="#ffffff" stroke="#C8B8DB"/><text x="468" y="100" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Retour à 60/40</text><text x="468" y="126" font-size="12.5" font-weight="500" fill="#0B132B" text-anchor="start">Cible : 0,60 × 115 000 € = 69 000 €</text><text x="468" y="152" font-size="12.5" font-weight="500" fill="#0B132B" text-anchor="start">−6 000 € actions, +6 000 € obligations</text><text x="468" y="178" font-size="13" font-weight="500" fill="#0B132B" text-anchor="start">Actions 69 000 € · obligations 46 000 €</text><text x="468" y="204" font-size="13" font-weight="700" fill="#16834a" text-anchor="start">Mix : de nouveau 60 % d’actions</text></g></svg>
