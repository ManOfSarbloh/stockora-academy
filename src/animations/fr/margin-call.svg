<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Animation : 10 000 € d’actions achetées avec 5 000 € d’argent propre et un prêt de 5 000 € ; les actions baissent de 30 % à 7 000 €, vos fonds propres tombent à 2 000 €, soit 29 % de la position, sous le minimum de 30 % du courtier ; un appel de marge suit et, si le courtier vend, il vous reste 2 000 €, une perte de 60 %" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-margin-call"><title>Animation : 10 000 € d’actions achetées avec 5 000 € d’argent propre et un prêt de 5 000 € ; les actions baissent de 30 % à 7 000 €, vos fonds propres tombent à 2 000 €, soit 29 % de la position, sous le minimum de 30 % du courtier ; un appel de marge suit et, si le courtier vend, il vous reste 2 000 €, une perte de 60 %</title><style>.mc-eq{transform-box:fill-box;transform-origin:50% 100%}@keyframes mc-eq{0%,12.5%{transform:scaleY(2.5)}50%,100%{transform:scaleY(1)}}.anim-armed .mc-eq{animation:mc-eq 8s ease-in-out both}@keyframes mc-gauge{0%,12.5%{transform:scaleX(1.75)}50%,100%{transform:scaleX(1)}}.mc-gfill{transform-box:fill-box;transform-origin:0 50%}.anim-armed .mc-gfill{animation:mc-gauge 8s ease-in-out both}@keyframes mc-t50{0%,48.75%{opacity:1}50%,100%{opacity:0}}@keyframes mc-t29{0%,48.75%{opacity:0}50%,100%{opacity:1}}.mc-t50{opacity:0}.anim-armed .mc-t50{animation:mc-t50 8s linear both}.anim-armed .mc-t29{animation:mc-t29 8s linear both}@keyframes mc-p10{0%,48.75%{opacity:1}50%,100%{opacity:0}}@keyframes mc-p7{0%,48.75%{opacity:0}50%,100%{opacity:1}}.mc-p10{opacity:0}.anim-armed .mc-p10{animation:mc-p10 8s linear both}.anim-armed .mc-p7{animation:mc-p7 8s linear both}@keyframes mc-call{0%,54.9%{opacity:0}58%,100%{opacity:1}}.anim-armed .mc-call{animation:mc-call 8s linear both}@keyframes mc-sold{0%,74.9%{opacity:0}78%,100%{opacity:1}}.anim-armed .mc-sold{animation:mc-sold 8s linear both}</style><rect width="760" height="360" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Acheter 10 000 € d’actions avec 5 000 € à vous</text><rect x="60" y="190" width="110" height="110" rx="6" fill="#3A506B"/><text x="115" y="250" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Prêt 5 000 €</text><rect class="mc-eq" x="60" y="146" width="110" height="44" rx="6" fill="#6A55A0"/><text x="115" y="322" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Votre position</text><g class="mc-p10"><text x="184" y="94" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="start">Valeur 10 000 €</text><text x="184" y="139" font-size="12.5" font-weight="700" fill="#6A55A0" text-anchor="start">Votre argent 5 000 €</text></g><g class="mc-p7"><text x="184" y="160" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="start">Baisse de 30 % : 7 000 €</text><text x="184" y="180" font-size="12.5" font-weight="700" fill="#6A55A0" text-anchor="start">À vous : 7 000 € − 5 000 €</text><text x="184" y="198" font-size="12.5" font-weight="700" fill="#6A55A0" text-anchor="start">= 2 000 €</text></g><text x="470" y="86" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="start">Vos fonds propres</text><rect x="470" y="98" width="260" height="22" rx="11" fill="#F3EEF8" stroke="#C8B8DB"/><rect class="mc-gfill" x="470" y="98" width="74.28" height="22" rx="11" fill="#6A55A0"/><line x1="548" x2="548" y1="92" y2="126" stroke="#c8352f" stroke-width="2.5"/><text x="548" y="142" font-size="11.5" font-weight="700" fill="#c8352f" text-anchor="middle">minimum du courtier 30 %</text><g class="mc-t50"><text x="730" y="86" font-size="13" font-weight="700" fill="#0B132B" text-anchor="end">50 %</text></g><g class="mc-t29"><text x="730" y="86" font-size="13" font-weight="700" fill="#c8352f" text-anchor="end">29 %</text></g><g class="mc-call"><rect x="470" y="160" width="260" height="50" rx="10" fill="#c8352f"/><text x="600" y="181" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Appel de marge</text><text x="600" y="199" font-size="12.5" font-weight="500" fill="#ffffff" text-anchor="middle">remettre de l’argent ou vente</text></g><g class="mc-sold"><text x="470" y="238" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">S’il vend à 7 000 €, il vous reste 2 000 € :</text><text x="470" y="258" font-size="13" font-weight="700" fill="#c8352f" text-anchor="start">une perte de 60 % de votre argent</text><text x="470" y="276" font-size="13" font-weight="700" fill="#c8352f" text-anchor="start">pour une baisse de 30 %.</text><text x="470" y="302" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Si les actions remontent,</text><text x="470" y="320" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">elles ne sont plus à vous.</text></g></svg>
