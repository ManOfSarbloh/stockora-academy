<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Animación: vendes 100 acciones prestadas a 50 € y recibes 5000 €; recomprar a 40 € cuesta 4000 €, un beneficio de 1000 €; a 80 € cuesta 8000 €, una pérdida de 3000 €; a 200 € cuesta 20.000 €, una pérdida de 15.000 €; la ganancia es limitada pero la pérdida no" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-short-sale"><title>Animación: vendes 100 acciones prestadas a 50 € y recibes 5000 €; recomprar a 40 € cuesta 4000 €, un beneficio de 1000 €; a 80 € cuesta 8000 €, una pérdida de 3000 €; a 200 € cuesta 20.000 €, una pérdida de 15.000 €; la ganancia es limitada pero la pérdida no</title><style>@keyframes sh-mk{0%,17.78%{transform:translateY(255px)}31.11%,40%{transform:translateY(268px)}53.33%,62.22%{transform:translateY(216px)}77.78%,100%{transform:translateY(60px)}}.sh-mk{transform:translateY(60px)}.anim-armed .sh-mk{animation:sh-mk 9s ease-in-out both}@keyframes sh-st0{0%,2.12%{opacity:0}5.22%,100%{opacity:1}}.anim-armed .sh-st0{animation:sh-st0 9s linear both}@keyframes sh-st1{0%,7.12%{opacity:0}10.22%,100%{opacity:1}}.anim-armed .sh-st1{animation:sh-st1 9s linear both}@keyframes sh-st2{0%,12.12%{opacity:0}15.22%,100%{opacity:1}}.anim-armed .sh-st2{animation:sh-st2 9s linear both}@keyframes sh-st3{0%,17.12%{opacity:0}20.22%,100%{opacity:1}}.anim-armed .sh-st3{animation:sh-st3 9s linear both}@keyframes sh-o0{0%,33.23%{opacity:0}36.33%,100%{opacity:1}}.anim-armed .sh-o0{animation:sh-o0 9s linear both}@keyframes sh-o1{0%,55.46%{opacity:0}58.56%,100%{opacity:1}}.anim-armed .sh-o1{animation:sh-o1 9s linear both}@keyframes sh-o2{0%,79.9%{opacity:0}83%,100%{opacity:1}}.anim-armed .sh-o2{animation:sh-o2 9s linear both}</style><rect width="760" height="360" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Vender en corto 100 acciones a 50 €</text><g class="sh-st0"><circle cx="48" cy="70" r="12" fill="#0B132B"/><text x="48" y="75" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="70" y="74" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Pedir prestadas 100 acciones</text></g><g class="sh-st1"><circle cx="48" cy="106" r="12" fill="#0B132B"/><text x="48" y="111" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="70" y="110" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Venderlas a 50 €: recibes 5000 €</text></g><g class="sh-st2"><circle cx="48" cy="142" r="12" fill="#0B132B"/><text x="48" y="147" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="70" y="146" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Después, recomprar 100 acciones</text></g><g class="sh-st3"><circle cx="48" cy="178" r="12" fill="#0B132B"/><text x="48" y="183" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="70" y="182" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Devolverlas al prestamista</text></g><line x1="390" x2="416" y1="320" y2="320" stroke="#e3e8ee"/><text x="384" y="324" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">0 €</text><line x1="390" x2="416" y1="255" y2="255" stroke="#e3e8ee"/><text x="384" y="259" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">50 €</text><line x1="390" x2="416" y1="190" y2="190" stroke="#e3e8ee"/><text x="384" y="194" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">100 €</text><line x1="390" x2="416" y1="125" y2="125" stroke="#e3e8ee"/><text x="384" y="129" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">150 €</text><line x1="390" x2="416" y1="60" y2="60" stroke="#e3e8ee"/><text x="384" y="64" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">200 €</text><line x1="403" x2="403" y1="60" y2="320" stroke="#C8B8DB" stroke-width="3" stroke-linecap="round"/><line x1="390" x2="735" y1="255" y2="255" stroke="#0B132B" stroke-dasharray="5 4"/><text x="735" y="249" font-size="11.5" font-weight="700" fill="#0B132B" text-anchor="end">vendidas a 50 €</text><g class="sh-o0"><circle cx="403" cy="268" r="6" fill="#16834a"/><text x="430" y="290" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Recompra a 40 €: 4000 €</text><text x="430" y="307" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="start">Beneficio 1000 €</text></g><g class="sh-o1"><circle cx="403" cy="216" r="6" fill="#c8352f"/><text x="430" y="212" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Recompra a 80 €: 8000 €</text><text x="430" y="229" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">Pérdida 3000 €</text></g><g class="sh-o2"><circle cx="403" cy="60" r="6" fill="#c8352f"/><text x="430" y="56" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Recompra a 200 €: 20.000 €</text><text x="430" y="73" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">Pérdida 15.000 €, el triple de lo recibido</text></g><g class="sh-mk"><path d="M388 0l-9-6v12z" fill="#6A55A0"/></g><text x="32" y="236" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Lo máximo que ganas son los 5000 € recibidos,</text><text x="32" y="254" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">si el precio cae a cero. La pérdida no tiene límite.</text></svg>
