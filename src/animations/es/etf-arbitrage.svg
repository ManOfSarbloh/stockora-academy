<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Animación: un ETF cotiza a 49,80 € mientras sus activos valen 50,00 € por participación; un participante autorizado compra participaciones en la bolsa, lo que empuja el precio hacia 50 €, las reembolsa al fondo a cambio de las acciones subyacentes y vende esas acciones" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-etf-arbitrage"><title>Animación: un ETF cotiza a 49,80 € mientras sus activos valen 50,00 € por participación; un participante autorizado compra participaciones en la bolsa, lo que empuja el precio hacia 50 €, las reembolsa al fondo a cambio de las acciones subyacentes y vende esas acciones</title><style>@keyframes ea-u1{0%,6.67%{transform:translate(315px,132px);opacity:0}8.33%{opacity:1}27.22%{opacity:1}28.89%,100%{transform:translate(485px,132px);opacity:0}}.ea-u1{opacity:0}.anim-armed .ea-u1{animation:ea-u1 9s ease-in-out both}@keyframes ea-u2{0%,37.78%{transform:translate(485px,132px);opacity:0}39.44%{opacity:1}53.89%{opacity:1}55.56%,100%{transform:translate(655px,132px);opacity:0}}.ea-u2{opacity:0}.anim-armed .ea-u2{animation:ea-u2 9s ease-in-out both}@keyframes ea-b1{0%,46.67%{transform:translate(655px,144px);opacity:0}48.33%{opacity:1}62.78%{opacity:1}64.44%,100%{transform:translate(485px,144px);opacity:0}}.ea-b1{opacity:0}.anim-armed .ea-b1{animation:ea-b1 9s ease-in-out both}@keyframes ea-b2{0%,68.89%{transform:translate(485px,144px);opacity:0}70.56%{opacity:1}87.22%{opacity:1}88.89%,100%{transform:translate(315px,144px);opacity:0}}.ea-b2{opacity:0}.anim-armed .ea-b2{animation:ea-b2 9s ease-in-out both}@keyframes ea-s1{0%,5.56%{opacity:.35}8.89%,100%{opacity:1}}.anim-armed .ea-s1{animation:ea-s1 9s linear both}@keyframes ea-s2{0%,36.67%{opacity:.35}40%,100%{opacity:1}}.anim-armed .ea-s2{animation:ea-s2 9s linear both}@keyframes ea-s3{0%,67.78%{opacity:.35}71.11%,100%{opacity:1}}.anim-armed .ea-s3{animation:ea-s3 9s linear both}@keyframes ea-price{0%,8.89%{transform:translateY(267.5px)}35.56%,100%{transform:translateY(162.5px)}}.ea-price{transform:translateY(162.5px)}.anim-armed .ea-price{animation:ea-price 9s ease-in-out both}@keyframes ea-t1{0%,35.56%{opacity:1}37.78%,100%{opacity:0}}@keyframes ea-t2{0%,35.56%{opacity:0}37.78%,100%{opacity:1}}.ea-t1{opacity:0}.anim-armed .ea-t1{animation:ea-t1 9s linear both}.anim-armed .ea-t2{animation:ea-t2 9s linear both}</style><rect width="760" height="360" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Cómo el arbitraje devuelve un ETF a su valor</text><text x="40" y="66" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="start">Precio del ETF en la bolsa</text><line x1="96" x2="200" y1="320" y2="320" stroke="#e3e8ee"/><text x="88" y="324" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">49,70 €</text><line x1="96" x2="200" y1="267.5" y2="267.5" stroke="#e3e8ee"/><text x="88" y="271.5" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">49,80 €</text><line x1="96" x2="200" y1="215" y2="215" stroke="#e3e8ee"/><text x="88" y="219" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">49,90 €</text><line x1="96" x2="200" y1="162.5" y2="162.5" stroke="#e3e8ee"/><text x="88" y="166.5" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">50,00 €</text><line x1="96" x2="200" y1="110" y2="110" stroke="#e3e8ee"/><text x="88" y="114" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">50,10 €</text><line x1="96" x2="200" y1="162.5" y2="162.5" stroke="#0B132B" stroke-width="2" stroke-dasharray="5 4"/><line x1="40" x2="62" y1="84" y2="84" stroke="#0B132B" stroke-width="2" stroke-dasharray="5 4"/><text x="68" y="88" font-size="11.5" font-weight="700" fill="#0B132B" text-anchor="start">Valor de los activos (NAV)</text><g class="ea-price"><rect x="110" y="-11" width="76" height="22" rx="11" fill="#6A55A0"/><text class="ea-t1" x="148" y="4" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">49,80 €</text><text class="ea-t2" x="148" y="4" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">≈ 50,00 €</text></g><rect x="250" y="92" width="130" height="64" rx="12" fill="#F3EEF8" stroke="#C8B8DB"/><text x="315" y="120" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Bolsa</text><rect x="420" y="92" width="130" height="64" rx="12" fill="#F3EEF8" stroke="#C8B8DB"/><text x="485" y="112" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Participante</text><text x="485" y="129" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">autorizado</text><rect x="590" y="92" width="130" height="64" rx="12" fill="#F3EEF8" stroke="#C8B8DB"/><text x="655" y="120" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">ETF (el fondo)</text><g class="ea-u1"><rect x="-14" y="-7" width="12" height="12" rx="2" fill="#6A55A0"/><rect x="2" y="-7" width="12" height="12" rx="2" fill="#6A55A0"/></g><g class="ea-u2"><rect x="-14" y="-7" width="12" height="12" rx="2" fill="#6A55A0"/><rect x="2" y="-7" width="12" height="12" rx="2" fill="#6A55A0"/></g><g class="ea-b1"><rect x="-16" y="-8" width="7" height="12" rx="1.5" fill="#3A506B"/><rect x="-6" y="-12" width="7" height="16" rx="1.5" fill="#0B132B"/><rect x="4" y="-6" width="7" height="10" rx="1.5" fill="#3A506B"/></g><g class="ea-b2"><rect x="-16" y="-8" width="7" height="12" rx="1.5" fill="#3A506B"/><rect x="-6" y="-12" width="7" height="16" rx="1.5" fill="#0B132B"/><rect x="4" y="-6" width="7" height="10" rx="1.5" fill="#3A506B"/></g><g class="ea-s1"><circle cx="262" cy="198" r="12" fill="#0B132B"/><text x="262" y="203" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="284" y="196" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Compra participaciones baratas en la bolsa a 49,80 €,</text><text x="284" y="214" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">por debajo del valor de 50,00 € de los activos.</text></g><g class="ea-s2"><circle cx="262" cy="248" r="12" fill="#0B132B"/><text x="262" y="253" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="284" y="246" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Las reembolsa al fondo y recibe</text><text x="284" y="264" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">las acciones subyacentes, a 50,00 € por participación.</text></g><g class="ea-s3"><circle cx="262" cy="298" r="12" fill="#0B132B"/><text x="262" y="303" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="284" y="296" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Vende esas acciones. La compra del paso 1</text><text x="284" y="314" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">ha devuelto el precio del ETF hacia 50 €.</text></g></svg>
