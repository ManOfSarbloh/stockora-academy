r to buy 500 shares</text><text x="40" y="66" font-size="13" font-weight="600" fill="#4D5470" text-anchor="start">Sellers in the order book</text><rect x="40" y="80" width="300" height="44" rx="8" fill="#F3EEF8" stroke="#C8B8DB"/><text x="56" y="108" font-size="15" font-weight="700" fill="#0B132B" text-anchor="start">€20.10</text><rect x="140" y="92" width="144" height="20" rx="4" fill="none" stroke="#C8B8DB" stroke-dasharray="3 3"/><rect class="mo-shrink mo-b" x="140" y="92" width="144" height="20" rx="4" fill="#6A55A0"/><text x="294" y="107" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">300 shares</text><rect x="40" y="136" width="300" height="44" rx="8" fill="#F3EEF8" stroke="#C8B8DB"/><text x="56" y="164" font-size="15" font-weight="700" fill="#0B132B" text-anchor="start">€20.02</text><rect x="140" y="148" width="96" height="20" rx="4" fill="none" stroke="#C8B8DB" stroke-dasharray="3 3"/><rect class="mo-shrink mo-a" x="140" y="148" width="96" height="20" rx="4" fill="#6A55A0"/><text x="246" y="163" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">200 shares</text><line x1="40" x2="340" y1="212" y2="212" stroke="#0B132B" stroke-width="2" stroke-dasharray="5 4"/><text x="40" y="232" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Last price on your screen: €20.00</text><g class="mo-pill"><rect x="40" y="250" width="300" height="34" rx="17" fill="#0B132B"/><text x="190" y="272" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mo-t1">Buy 500 at market</text><text x="190" y="272" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mo-t2">300 still to buy</text><text x="190" y="272" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mo-done">Filled: 500 shares</text></g><rect x="400" y="80" width="290" height="190" rx="10" fill="#ffffff" stroke="#C8B8DB"/><text x="418" y="106" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">What you pay</text><text x="418" y="136" font-size="13" font-weight="500" fill="#0B132B" text-anchor="start" class="mo-f1">200 × €20.02 = €4,004</text><text x="418" y="162" font-size="13" font-weight="500" fill="#0B132B" text-anchor="start" class="mo-f2">300 × €20.10 = €6,030</text><g class="mo-f3"><line x1="418" x2="672" y1="176" y2="176" stroke="#e3e8ee"/><text x="418" y="198" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Total €10,034 · about €20.07 a share</text><text x="418" y="224" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Expected at €20.00: €10,000</text><text x="418" y="248" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">Slippage: about €34</text></g></svg>
