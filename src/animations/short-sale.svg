<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Animation: you sell 100 borrowed shares at €50 and receive €5,000; buying back at €40 costs €4,000, a €1,000 profit; at €80 it costs €8,000, a €3,000 loss; at €200 it costs €20,000, a €15,000 loss; the gain is limited but the loss is not" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" class="anim-svg anim-short-sale"><title>Animation: you sell 100 borrowed shares at €50 and receive €5,000; buying back at €40 costs €4,000, a €1,000 profit; at €80 it costs €8,000, a €3,000 loss; at €200 it costs €20,000, a €15,000 loss; the gain is limited but the loss is not</title><style>@keyframes sh-mk{0%,17.78%{transform:translateY(255px)}31.11%,40%{transform:translateY(268px)}53.33%,62.22%{transform:translateY(216px)}77.78%,100%{transform:translateY(60px)}}.sh-mk{transform:translateY(60px)}.anim-armed .sh-mk{animation:sh-mk 9s ease-in-out both}@keyframes sh-st0{0%,2.12%{opacity:0}5.22%,100%{opacity:1}}.anim-armed .sh-st0{animation:sh-st0 9s linear both}@keyframes sh-st1{0%,7.12%{opacity:0}10.22%,100%{opacity:1}}.anim-armed .sh-st1{animation:sh-st1 9s linear both}@keyframes sh-st2{0%,12.12%{opacity:0}15.22%,100%{opacity:1}}.anim-armed .sh-st2{animation:sh-st2 9s linear both}@keyframes sh-st3{0%,17.12%{opacity:0}20.22%,100%{opacity:1}}.anim-armed .sh-st3{animation:sh-st3 9s linear both}@keyframes sh-o0{0%,33.23%{opacity:0}36.33%,100%{opacity:1}}.anim-armed .sh-o0{animation:sh-o0 9s linear both}@keyframes sh-o1{0%,55.46%{opacity:0}58.56%,100%{opacity:1}}.anim-armed .sh-o1{animation:sh-o1 9s linear both}@keyframes sh-o2{0%,79.9%{opacity:0}83%,100%{opacity:1}}.anim-armed .sh-o2{animation:sh-o2 9s linear both}</style><rect width="760" height="360" rx="14" fill="#ffffff"/><text x="32" y="34" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Selling short 100 shares at €50</text><g class="sh-st0"><circle cx="48" cy="70" r="12" fill="#0B132B"/><text x="48" y="75" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="70" y="74" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Borrow 100 shares</text></g><g class="sh-st1"><circle cx="48" cy="106" r="12" fill="#0B132B"/><text x="48" y="111" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="70" y="110" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Sell them at €50: you receive €5,000</text></g><g class="sh-st2"><circle cx="48" cy="142" r="12" fill="#0B132B"/><text x="48" y="147" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="70" y="146" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Later, buy 100 shares back</text></g><g class="sh-st3"><circle cx="48" cy="178" r="12" fill="#0B132B"/><text x="48" y="183" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="70" y="182" font-size="13" font-weight="600" fill="#0B132B" text-anchor="start">Return them to the lender</text></g><line x1="390" x2="416" y1="320" y2="320" stroke="#e3e8ee"/><text x="384" y="324" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">€0</text><line x1="390" x2="416" y1="255" y2="255" stroke="#e3e8ee"/><text x="384" y="259" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">€50</text><line x1="390" x2="416" y1="190" y2="190" stroke="#e3e8ee"/><text x="384" y="194" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">€100</text><line x1="390" x2="416" y1="125" y2="125" stroke="#e3e8ee"/><text x="384" y="129" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">€150</text><line x1="390" x2="416" y1="60" y2="60" stroke="#e3e8ee"/><text x="384" y="64" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="end">€200</text><line x1="403" x2="403" y1="60" y2="320" stroke="#C8B8DB" stroke-width="3" stroke-linecap="round"/><line x1="390" x2="735" y1="255" y2="255" stroke="#0B132B" stroke-dasharray="5 4"/><text x="735" y="249" font-size="11.5" font-weight="700" fill="#0B132B" text-anchor="end">sold at €50</text><g class="sh-o0"><circle cx="403" cy="268" r="6" fill="#16834a"/><text x="430" y="290" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Buy back at €40: €4,000</text><text x="430" y="307" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="start">Profit €1,000</text></g><g class="sh-o1"><circle cx="403" cy="216" r="6" fill="#c8352f"/><text x="430" y="212" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Buy back at €80: €8,000</text><text x="430" y="229" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">Loss €3,000</text></g><g class="sh-o2"><circle cx="403" cy="60" r="6" fill="#c8352f"/><text x="430" y="56" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Buy back at €200: €20,000</text><text x="430" y="73" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">Loss €15,000, three times what you received</text></g><g class="sh-mk"><path d="M388 0l-9-6v12z" fill="#6A55A0"/></g><text x="32" y="236" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">The most you can gain is the €5,000 you received,</text><text x="32" y="254" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="start">if the price falls to zero. The loss has no limit.</text></svg>
