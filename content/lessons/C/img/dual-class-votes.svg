<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Dual-class example: the founder holds 10% of the economic value but about 53% of the votes (100 of 190 million votes)" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Dual-class example: the founder holds 10% of the economic value but about 53% of the votes (100 of 190 million votes)</title><rect width="720" height="280" rx="14" fill="#ffffff"/><text x="40" y="38" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">One company, two very different shares of control</text><text x="40" y="74" font-size="13" font-weight="600" fill="#4D5470" text-anchor="start">Share of the economic value (dividends)</text><rect x="40" y="84" width="64" height="40" rx="6" fill="#0B132B"/><rect x="104" y="84" width="576" height="40" rx="6" fill="#C8B8DB"/><text x="94" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">10%</text><text x="668" y="110" font-size="13" font-weight="700" fill="#0B132B" text-anchor="end">90%</text><text x="40" y="152" font-size="13" font-weight="600" fill="#4D5470" text-anchor="start">Share of the votes</text><rect x="40" y="162" width="336.8" height="40" rx="6" fill="#0B132B"/><rect x="376.8" y="162" width="303.2" height="40" rx="6" fill="#C8B8DB"/><text x="366.8" y="188" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">53%</text><text x="668" y="188" font-size="13" font-weight="700" fill="#0B132B" text-anchor="end">47%</text><rect x="40" y="225" width="14" height="14" rx="3" fill="#0B132B"/><text x="62" y="236" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Founder: 10 million Class B shares with 10 votes each</text><rect x="400" y="225" width="14" height="14" rx="3" fill="#C8B8DB"/><text x="422" y="236" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Public: 90 million Class A shares, 1 vote each</text></svg>
