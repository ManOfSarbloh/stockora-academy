<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="A market order to buy 500 shares fills 200 at €20.02 and 300 at €20.10: €10,034 in total, about €20.07 a share instead of the €20.00 last price, about €34 of slippage" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>A market order to buy 500 shares fills 200 at €20.02 and 300 at €20.10: €10,034 in total, about €20.07 a share instead of the €20.00 last price, about €34 of slippage</title><defs><marker id="fa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0E9F9A"/></marker></defs><rect width="720" height="300" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">A market order to buy 500 shares</text><text x="40" y="66" font-size="13" font-weight="600" fill="#516075" text-anchor="start">Sellers in the order book</text><rect x="40" y="82" width="300" height="44" rx="8" fill="#E9F1F6" stroke="#9FB7C9" stroke-width="1.5"/><text x="56" y="110" font-size="15" font-weight="700" fill="#1a2433" text-anchor="start">€20.10</text><rect x="140" y="94" width="144" height="20" rx="4" fill="#0E9F9A"/><text x="290" y="109" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">300 shares</text><rect x="40" y="138" width="300" height="44" rx="8" fill="#E9F1F6" stroke="#9FB7C9" stroke-width="1.5"/><text x="56" y="166" font-size="15" font-weight="700" fill="#1a2433" text-anchor="start">€20.02</text><rect x="140" y="150" width="96" height="20" rx="4" fill="#0E9F9A"/><text x="242" y="165" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">200 shares</text><line x1="40" y1="214" x2="340" y2="214" stroke="#0F2A44" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="40" y="234" font-size="12.5" font-weight="600" fill="#0F2A44" text-anchor="start">Last price