<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Bar chart on one scale: a 10% loss needs an 11.1% gain to break even, 20% needs 25%, 33% needs 50%, 50% needs 100% and 80% needs 400%" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Bar chart on one scale: a 10% loss needs an 11.1% gain to break even, 20% needs 25%, 33% needs 50%, 50% needs 100% and 80% needs 400%</title><rect width="760" height="340" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">A loss needs a bigger gain to break even</text><text x="240" y="62" font-size="13" font-weight="700" fill="#c8352f" text-anchor="end">Loss</text><text x="260" y="62" font-size="13" font-weight="700" fill="#16834a" text-anchor="start">Gain needed to get back</text><rect x="239" y="76" width="11" height="30" rx="4" fill="#c8352f"/><text x="231" y="96" font-size="13" font-weight="700" fill="#c8352f" text-anchor="end">−10%</text><rect x="250" y="76" width="12.2" height="30" rx="4" fill="#16834a"/><text x="270.2" y="96" font-size="13" font-weight="700" fill="#16834a" text-anchor="start">+11.1%</text><rect x="228" y="122" width="22" height="30" rx="4" fill="#c8352f"/><text x="220" y="142" font-size="13" font-weight="700" fill="#c8352f" text-anchor="end">−20%</text><rect x="250" y="122" width="27.5" height="30" rx="4" fill="#16834a"/><text x="285.5" y="142" font-size="13" font-weight="700" fill="#16834a" text-anchor="start">+25%</text><rect x="213.7" y="168" width="36.3" height="30" rx="4" fill="#c8352f"/><text x="205.7" y="188" font-size="13" font-weight="700" fill="#c8352f" text-anchor="end">−33%</text><rect x="250" y="168" width="55" height="30" rx="4" fill="#16834a"/><text x="313" y="188" font-size="13" font-weight="700" fill="#16834a" text-anchor="start">+50%</text><rect x="195" y="214" width="55" height="30" rx="4" fill="#c8352f"/><text x="187" y="234" font-size="13" font-weight="700" fill="#c8352f" text-anchor="end">−50%</text><rect x="250" y="214" width="110" height="30" rx="4" fill="#16834a"/><text x="368" y="234" font-size="13" font-weight="700" fill="#16834a" text-anchor="start">+100%</text><rect x="162" y="260" width="88" height="30" rx="4" fill="#c8352f"/><text x="154" y="280" font-size="13" font-weight="700" fill="#c8352f" text-anchor="end">−80%</text><rect x="250" y="260" width="440" height="30" rx="4" fill="#16834a"/><text x="698" y="280" font-size="13" font-weight="700" fill="#16834a" text-anchor="start">+400%</text><line x1="250" y1="70" x2="250" y2="296" stroke="#1a2433" stroke-width="1.5" stroke-linecap="round"/><text x="40" y="322" font-size="12" font-weight="500" fill="#516075" text-anchor="start">Both sides use the same scale.</text></svg>
