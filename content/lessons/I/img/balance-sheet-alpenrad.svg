<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-label="Alpenrad AG balance sheet in € millions: assets of 500 (cash 40, receivables 60, inventory 100, property plant and equipment 220, intangibles 80) equal liabilities of 300 (current 120, long-term loans and bonds 130, provisions 50) plus shareholders' equity of 200" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Alpenrad AG balance sheet in € millions: assets of 500 (cash 40, receivables 60, inventory 100, property plant and equipment 220, intangibles 80) equal liabilities of 300 (current 120, long-term loans and bonds 130, provisions 50) plus shareholders' equity of 200</title><rect width="780" height="420" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Alpenrad AG balance sheet, 31 December 2025 (€ millions)</text><text x="255" y="60" font-size="13" font-weight="700" fill="#4D5470" text-anchor="middle">What it owns: assets 500</text><text x="545" y="60" font-size="13" font-weight="700" fill="#4D5470" text-anchor="middle">Who financed it: 300 + 200</text><rect x="140" y="70" width="230" height="22.8" rx="4" fill="#ECE5F4"/><text x="150" y="86.4" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Cash</text><text x="360" y="86.4" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="end">40</text><rect x="140" y="94.8" width="230" height="35.2" rx="4" fill="#D8CCE7"/><text x="150" y="117.4" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Receivables</text><text x="360" y="117.4" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="end">60</text><rect x="140" y="132" width="230" height="60" rx="4" fill="#B29FCF"/><text x="150" y="167" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Inventory</text><text x="360" y="167" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="end">100</text><rect x="140" y="194" width="230" height="134.4" rx="4" fill="#3A506B"/><text x="150" y="266.2" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Property, plant, equipment</text><text x="360" y="266.2" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="end">220</text><rect x="140" y="330.4" width="230" height="47.6" rx="4" fill="#26355A"/><text x="150" y="359.2" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Intangible assets</text><text x="360" y="359.2" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="end">80</text><rect x="430" y="70" width="230" height="72.4" rx="4" fill="#F3D9D7"/><text x="440" y="111.2" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Current liabilities</text><text x="650" y="111.2" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="end">120</text><rect x="430" y="144.4" width="230" height="78.6" rx="4" fill="#E3AFAB"/><text x="440" y="188.7" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Long-term loans and bonds</text><text x="650" y="188.7" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="end">130</text><rect x="430" y="225" width="230" height="29" rx="4" fill="#D58C86"/><text x="440" y="244.5" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Provisions and other</text><text x="650" y="244.5" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="end">50</text><rect x="430" y="256" width="230" height="122" rx="4" fill="#0B132B"/><text x="440" y="322" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Shareholders' equity</text><text x="650" y="322" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="end">200</text><path d="M136 72 h-10 V192 h10" fill="none" stroke="#4D5470" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="136" font-size="12" font-weight="600" fill="#4D5470" text-anchor="end">Current 200</text><path d="M136 196 h-10 V378 h10" fill="none" stroke="#4D5470" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="291" font-size="12" font-weight="600" fill="#4D5470" text-anchor="end">Non-current 300</text><path d="M664 72 h10 V254 h-10" fill="none" stroke="#4D5470" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="167" font-size="12" font-weight="600" fill="#4D5470" text-anchor="start">Liabilities 300</text><path d="M664 258 h10 V378 h-10" fill="none" stroke="#4D5470" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="322" font-size="12" font-weight="600" fill="#4D5470" text-anchor="start">Equity 200</text><text x="390" y="414" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Assets 500 = liabilities 300 + equity 200. It always balances.</text></svg>
