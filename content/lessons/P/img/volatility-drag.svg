<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="Volatility drag: €1,000 rises 50% to €1,500 and then falls 50% to €750; the average of the two returns is 0% but the actual result is −25%" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Volatility drag: €1,000 rises 50% to €1,500 and then falls 50% to €750; the average of the two returns is 0% but the actual result is −25%</title><rect width="700" height="330" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">+50% then −50% does not get you back to the start</text><line x1="70" y1="140" x2="520" y2="140" stroke="#0F2A44" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><text x="526" y="144" font-size="12.5" font-weight="600" fill="#0F2A44" text-anchor="start">Start: €1,000</text><rect x="100" y="140" width="90" height="130" rx="5" fill="#3B6E8F"/><text x="145" y="130" font-size="14" font-weight="700" fill="#1a2433" text-anchor="middle">€1,000</text><text x="145" y="294" font-size="13" font-weight="600" fill="#516075" text-anchor="middle">Start</text><rect x="240" y="75" width="90" height="195" rx="5" fill="#16834a"/><text x="285" y="65" font-size="14" font-weight="700" fill="#1a2433" text-anchor="middle">€1,500</text><text x="285" y="294" font-size="13" font-weight="600" fill="#516075" text-anchor="middle">After +50%</text><rect x="380" y="172.5" width="90" height="97.5" rx="5" fill="#c8352f"/><text x="425" y="162.5" font-size="14" font-weight="700" fill="#1a2433" text-anchor="middle">€750</text><text x="425" y="294" font-size="13" font-weight="600" fill="#516075" text-anchor="middle">Then −50%</text><line x1="70" y1="270" x2="520" y2="270" stroke="#1a2433" stroke-width="1.5" stroke-linecap="round"/><rect x="530" y="160" width="150" height="92" rx="10" fill="#E9F1F6" stroke="#9FB7C9" stroke-width="1.5"/><text x="545" y="186" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Average of the</text><text x="545" y="204" font-size="12.5" font-weight="700" fill="#1a2433" text-anchor="start">two returns: 0%</text><text x="545" y="230" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Actual result:</text><text x="545" y="246" font-size="14" font-weight="700" fill="#c8352f" text-anchor="start">−25%</text></svg>
