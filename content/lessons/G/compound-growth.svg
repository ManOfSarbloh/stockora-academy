<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Inter, system-ui, sans-serif">
<title>Line chart: €10,000 growing at 5% a year for 30 years. With compound growth it reaches about €43,219; with simple growth (interest not reinvested) about €25,000.</title>
