<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A fictional quote line: Alpenrad AG, Prime Market, high 31.40, low 30.10, close 30.20 eD, −3.8%, volume 182,000, turnover €5.5 million; eD means ex-dividend, so most of the fall is the €1.10 dividend deduction" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>A fictional quote line: Alpenrad AG, Prime Market, high 31.40, low 30.10, close 30.20 eD, −3.8%, volume 182,000, turnover €5.5 million; eD means ex-dividend, so most of the fall is the €1.10 dividend deduction</title><rect width="760" height="300" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">Reading one line of a quote page (fictional example)</text><rect x="36" y="64" width="688" height="52" rx="8" fill="#E9F1F6" stroke="#9FB7C9" stroke-width="1.5"/><text x="48" y="96" font-size="14" font-weight="700" fill="#1a2433" text-anchor="start">Alpenrad AG</text><line x1="103" y1="110" x2="103" y2="136" stroke="#9FB7C9" stroke-width="1.2" stroke-linecap="round"/><text x="103" y="150" font-size="12.5" font-weight="600" fill="#516075" text-anchor="middle">Name</text><text x="182" y="96" font-size="14" font-weight="700" fill="#1a2433" text-anchor="start">Prime Market</text><line x1="228" y1="110" x2="228" y2="180" stroke="#9FB7C9" stroke-width="1.2" stroke-linecap="round"/><text x="228" y="194" font-size="12.5" font-weight="600" fill="#516075" text-anchor="middle">Market segment</text><text x="298" y="96" font-size="14" font-weight="700" fill="#1a2433" text-anchor="start">31.40 / 30.10 / 30.20 eD</text><line x1="385" y1="110" x2="385" y2="136" stroke="#9FB7C9" stroke-width="1.2" stroke-linecap="round"/><text x="385" y="150" font-size="12.5" font-weight="600" fill="#516075" text-anchor="middle">High / low / close</text><text x="496" y="96" font-size="14" font-weight="700" fill="#c8352f" text-anchor="start">−3.8%</text><line x1="523" y1="110" x2="523" y2="180" stroke="#9FB7C9" stroke-width="1.2" stroke-linecap="round"/><text x="523" y="194" font-size="12.5" font-weight="600" fill="#516075" text-anchor="middle">Change on the day</text><text x="574" y="96" font-size="14" font-weight="700" fill="#1a2433" text-anchor="start">182,000</text><line x1="608" y1="110" x2="608" y2="136" stroke="#9FB7C9" stroke-width="1.2" stroke-linecap="round"/><text x="608" y="150" font-size="12.5" font-weight="600" fill="#516075" text-anchor="middle">Volume (shares)</text><text x="666" y="96" font-size="14" font-weight="700" fill="#1a2433" text-anchor="start">€5.5 m</text><line x1="696" y1="110" x2="696" y2="180" stroke="#9FB7C9" stroke-width="1.2" stroke-linecap="round"/><text x="696" y="194" font-size="12.5" font-weight="600" fill="#516075" text-anchor="middle">Turnover (value)</text><rect x="40" y="226" width="680" height="54" rx="10" fill="#ffffff" stroke="#c98500" stroke-width="1.5"/><text x="56" y="248" font-size="13" font-weight="700" fill="#1a2433" text-anchor="start">&quot;eD&quot; = ex-dividend: a €1.10 dividend was deducted from the price that day.</text><text x="56" y="268" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Most of the −3.8% is the dividend, not a loss for shareholders.</text></svg>
