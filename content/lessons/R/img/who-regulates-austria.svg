<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="EU rules and ESMA sit above the FMA, Austria's independent supervisor for banking, insurance, pension fund and securities supervision; the OeNB contributes financial stability and inspects banks for the FMA; the FMA supervises banks, insurers and pension funds, investment firms, issuers and, by legal supervision, the Wiener Börse" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>EU rules and ESMA sit above the FMA, Austria's independent supervisor for banking, insurance, pension fund and securities supervision; the OeNB contributes financial stability and inspects banks for the FMA; the FMA supervises banks, insurers and pension funds, investment firms, issuers and, by legal supervision, the Wiener Börse</title><defs><marker id="ra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3A506B"/></marker></defs><rect width="760" height="408" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Who watches over the Austrian market</text><rect x="40" y="56" width="680" height="62" rx="10" fill="#F3EEF8" stroke="#C8B8DB" stroke-width="1.5"/><text x="380" y="83" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">European Union</text><text x="380" y="101" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Rules such as MiFID II, MAR, the Prospectus Regulation and PRIIPs · ESMA coordinates national regulators</text><line x1="350" y1="122" x2="350" y2="150" stroke="#3A506B" stroke-width="2" marker-end="url(#ra)" stroke-linecap="round"/><rect x="200" y="154" width="300" height="70" rx="10" fill="#ffffff" stroke="#0B132B" stroke-width="1.5"/><text x="350" y="176" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">FMA (Finanzmarktaufsicht)</text><text x="350" y="194" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Banking, insurance, pension fund and</text><text x="350" y="212" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">securities supervision; independent</text><rect x="526" y="154" width="194" height="70" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="623" y="176" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">OeNB</text><text x="623" y="194" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Financial stability;</text><text x="623" y="212" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">bank inspections for the FMA</text><line x1="504" y1="189" x2="522" y2="189" stroke="#3A506B" stroke-width="2" stroke-linecap="round"/><path d="M350 228 C350 262 104 262 104 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="104" y="335" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Banks</text><path d="M350 228 C350 262 242 262 242 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="178" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="242" y="326" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Insurers and</text><text x="242" y="344" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">pension funds</text><path d="M350 228 C350 262 380 262 380 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="380" y="326" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Investment firms</text><text x="380" y="344" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">and advisers</text><path d="M350 228 C350 262 518 262 518 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="454" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="518" y="317" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Issuers</text><text x="518" y="335" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">prospectuses,</text><text x="518" y="353" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">disclosure</text><path d="M350 228 C350 262 656 262 656 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="592" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="656" y="317" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Wiener Börse</text><text x="656" y="335" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">legal supervision</text><text x="656" y="353" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">of the exchange</text><text x="40" y="390" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">The FMA also monitors market abuse (insider dealing, manipulation) and publishes investor warnings.</text></svg>
