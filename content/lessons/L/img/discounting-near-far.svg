<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Present value of €100: paid in 1 year it is worth €96.15 at 4% and €94.34 at 6% (about −2%); paid in 20 years it is worth €45.64 at 4% and €31.18 at 6% (about −32%)" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Present value of €100: paid in 1 year it is worth €96.15 at 4% and €94.34 at 6% (about −2%); paid in 20 years it is worth €45.64 at 4% and €31.18 at 6% (about −32%)</title><rect width="720" height="330" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">What €100 of future cash is worth today</text><rect x="430" y="23" width="14" height="14" rx="3" fill="#3B6E8F"/><text x="452" y="34" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">at a 4% discount rate</text><rect x="430" y="45" width="14" height="14" rx="3" fill="#0F2A44"/><text x="452" y="56" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">at a 6% discount rate</text><line x1="70" y1="260" x2="680" y2="260" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="62" y="264" font-size="12" font-weight="500" fill="#516075" text-anchor="end">€0</text><line x1="70" y1="175" x2="680" y2="175" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="62" y="179" font-size="12" font-weight="500" fill="#516075" text-anchor="end">€50</text><line x1="70" y1="90" x2="680" y2="90" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="62" y="94" font-size="12" font-weight="500" fill="#516075" text-anchor="end">€100</text><rect x="130" y="96.5" width="80" height="163.5" rx="4" fill="#3B6E8F"/><text x="170" y="88.5" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">€96.15</text><rect x="222" y="99.6" width="80" height="160.4" rx="4" fill="#0F2A44"/><text x="262" y="91.6" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">€94.34</text><text x="216" y="284" font-size="13" font-weight="600" fill="#516075" text-anchor="middle">Company A: €100 in 1 year</text><text x="216" y="306" font-size="13" font-weight="700" fill="#c8352f" text-anchor="middle">Higher rate: −2%</text><rect x="420" y="182.4" width="80" height="77.6" rx="4" fill="#3B6E8F"/><text x="460" y="174.4" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">€45.64</text><rect x="512" y="207" width="80" height="53" rx="4" fill="#0F2A44"/><text x="552" y="199" font-size="13" font-weight="700" fill="#1a2433" text-anchor="middle">€31.18</text><text x="506" y="284" font-size="13" font-weight="600" fill="#516075" text-anchor="middle">Company B: €100 in 20 years</text><text x="506" y="306" font-size="13" font-weight="700" fill="#c8352f" text-anchor="middle">Higher rate: −32%</text></svg>
