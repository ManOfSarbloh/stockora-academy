<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 572" font-family="Inter, system-ui, sans-serif">
<title>Timeline of an IPO in eight steps: Preparation, Choose the banks, Due diligence and prospectus, Approval, Investor education and bookbuilding, Pricing and allocation, First trading day, Stabilisation and lock-up</title>
<rect width="560" height="572" rx="16" fill="#ffffff"/>
<text x="28" y="38" font-size="13" font-weight="700" fill="#516075" letter-spacing="0.5">THE IPO PROCESS</text>
<line x1="48" y1="72" x2="48" y2="520" stroke="#C9D6E2" stroke-width="3"/>
<circle cx="48" cy="72" r="13" fill="#0F2A44"/><text x="48" y="76.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
<text x="76" y="70" font-size="15" font-weight="600" fill="#1A2433">Preparation</text>
<text x="76" y="89" font-size="12.5" fill="#516075">Become an AG, accounting standards, governance</text>
<text x="536" y="70" text-anchor="end" font-size="11" font-weight="600" fill="#0A7672">Months before</text>
<circle cx="48" cy="136" r="13" fill="#0F2A44"/><text x="48" y="140.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
<text x="76" y="134" font-size="15" font-weight="600" fill="#1A2433">Choose the banks</text>
<text x="76" y="153" font-size="12.5" fill="#516075">Underwriters and lead bookrunner</text>
<circle cx="48" cy="200" r="13" fill="#0F2A44"/><text x="48" y="204.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
<text x="76" y="198" font-size="15" font-weight="600" fill="#1A2433">Due diligence and prospectus</text>
<text x="76" y="217" font-size="12.5" fill="#516075">Check the company, write the offering document</text>
<circle cx="48" cy="264" r="13" fill="#0F2A44"/><text x="48" y="268.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
<text x="76" y="262" font-size="15" font-weight="600" fill="#1A2433">Approval</text>
<text x="76" y="281" font-size="12.5" fill="#516075">FMA (Austria) approves the prospectus</text>
<circle cx="48" cy="328" r="13" fill="#0F2A44"/><text x="48" y="332.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
<text x="76" y="326" font-size="15" font-weight="600" fill="#1A2433">Investor education and bookbuilding</text>
<text x="76" y="345" font-size="12.5" fill="#516075">Price range, roadshow, investors place orders</text>
<text x="536" y="326" text-anchor="end" font-size="11" font-weight="600" fill="#0A7672">Subscription period</text>
<circle cx="48" cy="392" r="13" fill="#0F2A44"/><text x="48" y="396.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
<text x="76" y="390" font-size="15" font-weight="600" fill="#1A2433">Pricing and allocation</text>
<text x="76" y="409" font-size="12.5" fill="#516075">Final price set, shares allocated</text>
<circle cx="48" cy="456" r="13" fill="#0E9F9A"/><text x="48" y="460.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">7</text>
<text x="76" y="454" font-size="15" font-weight="600" fill="#1A2433">First trading day</text>
<text x="76" y="473" font-size="12.5" fill="#516075">Shares start trading on the exchange</text>
<text x="536" y="454" text-anchor="end" font-size="11" font-weight="600" fill="#0A7672">Listing day</text>
<circle cx="48" cy="520" r="13" fill="#0F2A44"/><text x="48" y="524.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">8</text>
<text x="76" y="518" font-size="15" font-weight="600" fill="#1A2433">Stabilisation and lock-up</text>
<text x="76" y="537" font-size="12.5" fill="#516075">Up to 30 days stabilisation; insiders locked up</text>
<text x="536" y="518" text-anchor="end" font-size="11" font-weight="600" fill="#0A7672">Weeks and months after</text>
</svg>
