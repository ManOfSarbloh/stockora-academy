<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Timeline of a normal trading day in Vienna time: Vienna opening auction 08:55, continuous trading 09:00 to 17:30 with a short midday auction, closing auction 17:30 to 17:35, trade at close to 17:45; the NYSE core session normally runs 15:30 to 22:00 Vienna time, so both are open from 15:30 to 17:30" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Timeline of a normal trading day in Vienna time: Vienna opening auction 08:55, continuous trading 09:00 to 17:30 with a short midday auction, closing auction 17:30 to 17:35, trade at close to 17:45; the NYSE core session normally runs 15:30 to 22:00 Vienna time, so both are open from 15:30 to 17:30</title><rect width="760" height="300" rx="14" fill="#ffffff"/><text x="60" y="36" font-size="16" font-weight="700" fill="#1a2433" text-anchor="start">A normal trading day, in Vienna time</text><line x1="60" y1="58" x2="60" y2="212" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="60" y="230" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">08:00</text><line x1="155.7" y1="58" x2="155.7" y2="212" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="155.7" y="230" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">10:00</text><line x1="251.4" y1="58" x2="251.4" y2="212" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="251.4" y="230" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">12:00</text><line x1="347.1" y1="58" x2="347.1" y2="212" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="347.1" y="230" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">14:00</text><line x1="442.9" y1="58" x2="442.9" y2="212" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="442.9" y="230" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">16:00</text><line x1="538.6" y1="58" x2="538.6" y2="212" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="538.6" y="230" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">18:00</text><line x1="634.3" y1="58" x2="634.3" y2="212" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="634.3" y="230" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">20:00</text><line x1="730" y1="58" x2="730" y2="212" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="730" y="230" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">22:00</text><rect x="418.9" y="60" width="95.7" height="150" rx="6" fill="rgba(14,159,154,0.10)" stroke="#0E9F9A" stroke-width="1.2" stroke-dasharray="4 4"/><text x="466.8" y="74" font-size="12" font-weight="700" fill="#0E9F9A" text-anchor="middle">Both open</text><text x="54" y="88" font-size="12.5" font-weight="600" fill="#516075" text-anchor="start">Vienna Stock Exchange (ATX shares)</text><rect x="60" y="96" width="43.9" height="30" rx="3" fill="#9FB7C9"/><rect x="103.9" y="96" width="4" height="30" rx="3" fill="#c98500"/><rect x="107.9" y="96" width="143.6" height="30" rx="3" fill="#0E9F9A"/><rect x="251.4" y="96" width="4" height="30" rx="3" fill="#c98500"/><rect x="253.8" y="96" width="260.8" height="30" rx="3" fill="#0E9F9A"/><rect x="514.6" y="96" width="4" height="30" rx="3" fill="#c98500"/><rect x="518.6" y="96" width="8" height="30" rx="3" fill="#3B6E8F"/><rect x="526.6" y="96" width="4" height="30" rx="3" fill="#9FB7C9"/><text x="179.6" y="116" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">09:00–17:30</text><text x="54" y="158" font-size="12.5" font-weight="600" fill="#516075" text-anchor="start">New York Stock Exchange core session (normally)</text><rect x="418.9" y="166" width="311.1" height="30" rx="3" fill="#0F2A44"/><text x="574.5" y="186" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">15:30–22:00</text><rect x="60" y="253" width="14" height="14" rx="3" fill="#0E9F9A"/><text x="82" y="264" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Continuous trading</text><rect x="230" y="253" width="14" height="14" rx="3" fill="#c98500"/><text x="252" y="264" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Auctions (open, midday, close)</text><rect x="460" y="253" width="14" height="14" rx="3" fill="#3B6E8F"/><text x="482" y="264" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Trade at close</text><rect x="600" y="253" width="14" height="14" rx="3" fill="#9FB7C9"/><text x="622" y="264" font-size="12.5" font-weight="500" fill="#516075" text-anchor="start">Pre- and post-trading</text></svg>
