<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="Inter, system-ui, sans-serif">
<title>Order book example: sellers (asks) at 10.04 euros for 300 shares, 10.03 for 500, 10.02 for 200; buyers (bids) at 10.00 for 400, 9.99 for 600, 9.98 for 1000. The spread is 0.02 euros.</title>
<rect width="560" height="400" rx="16" fill="#ffffff"/>
<text x="28" y="36" font-size="13" font-weight="700" fill="#516075" letter-spacing="0.5">ORDER BOOK</text>
<text x="160" y="66" font-size="12" font-weight="600" fill="#516075">Price</text><text x="260" y="66" font-size="12" font-weight="600" fill="#516075">Shares</text>
<text x="28" y="128" font-size="13" font-weight="700" fill="#B4441A">Sellers</text><text x="28" y="146" font-size="11.5" fill="#516075">(asks)</text>
<rect x="260" y="78" width="60.0" height="26" rx="4" fill="#F4C9B5"/><text x="160" y="96" font-size="14" font-weight="600" fill="#1A2433">€10.04</text><text x="324.0" y="96" font-size="13" fill="#1A2433">300</text>
<rect x="260" y="112" width="100.0" height="26" rx="4" fill="#F4C9B5"/><text x="160" y="130" font-size="14" font-weight="600" fill="#1A2433">€10.03</text><text x="364.0" y="130" font-size="13" fill="#1A2433">500</text>
<rect x="260" y="146" width="40.0" height="26" rx="4" fill="#F4C9B5"/><text x="160" y="164" font-size="14" font-weight="600" fill="#1A2433">€10.02</text><text x="304.0" y="164" font-size="13" fill="#1A2433">200</text>
<line x1="150" y1="186" x2="532" y2="186" stroke="#C9D6E2" stroke-dasharray="4 4"/>
<text x="532" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#0A7672">Best ask €10.02</text>
<text x="532" y="202" text-anchor="end" font-size="12" font-weight="600" fill="#0A7672">Best bid €10.00</text>
<text x="160" y="192" font-size="12" font-weight="700" fill="#516075">Spread €0.02</text>
<text x="28" y="254" font-size="13" font-weight="700" fill="#0A7672">Buyers</text><text x="28" y="272" font-size="11.5" fill="#516075">(bids)</text>
<rect x="260" y="204" width="80.0" height="26" rx="4" fill="#BFE6E3"/><text x="160" y="222" font-size="14" font-weight="600" fill="#1A2433">€10.00</text><text x="344.0" y="222" font-size="13" fill="#1A2433">400</text>
<rect x="260" y="238" width="120.0" height="26" rx="4" fill="#BFE6E3"/><text x="160" y="256" font-size="14" font-weight="600" fill="#1A2433">€9.99</text><text x="384.0" y="256" font-size="13" fill="#1A2433">600</text>
<rect x="260" y="272" width="200.0" height="26" rx="4" fill="#BFE6E3"/><text x="160" y="290" font-size="14" font-weight="600" fill="#1A2433">€9.98</text><text x="464.0" y="290" font-size="13" fill="#1A2433">1,000</text>
<text x="28" y="380" font-size="11.5" fill="#516075">Best prices sit closest to the middle. At the same price, earlier orders come first.</text>
</svg>
