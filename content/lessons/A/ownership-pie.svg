<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter, system-ui, sans-serif">
<title>Pie chart: a company with 1,000 shares owned by a founder (40%), a pension fund (30%), many small investors (27.5%) and you (25 shares, 2.5%)</title>
<rect width="520" height="300" rx="16" fill="#ffffff"/>
<path d="M150.00 150.00 L150.00 40.00 A110 110 0 0 1 214.66 238.99 Z" fill="#0F2A44" stroke="#ffffff" stroke-width="2"/><path d="M150.00 150.00 L214.66 238.99 A110 110 0 0 1 45.38 183.99 Z" fill="#3B6E8F" stroke="#ffffff" stroke-width="2"/><path d="M150.00 150.00 L45.38 183.99 A110 110 0 0 1 132.79 41.35 Z" fill="#9FB7C9" stroke="#ffffff" stroke-width="2"/><path d="M149.22 140.03 L132.01 31.39 A110 110 0 0 1 149.22 30.03 Z" fill="#0E9F9A" stroke="#ffffff" stroke-width="2"/>
<rect x="300" y="66" width="16" height="16" rx="4" fill="#0F2A44"/><text x="326" y="79" font-size="15" font-weight="600" fill="#1A2433">A founder</text><text x="326" y="98" font-size="13" fill="#516075">400 shares = 40%</text><rect x="300" y="114" width="16" height="16" rx="4" fill="#3B6E8F"/><text x="326" y="127" font-size="15" font-weight="600" fill="#1A2433">A pension fund</text><text x="326" y="146" font-size="13" fill="#516075">300 shares = 30%</text><rect x="300" y="162" width="16" height="16" rx="4" fill="#9FB7C9"/><text x="326" y="175" font-size="15" font-weight="600" fill="#1A2433">Many small investors</text><text x="326" y="194" font-size="13" fill="#516075">275 shares = 27.5%</text><rect x="300" y="210" width="16" height="16" rx="4" fill="#0E9F9A"/><text x="326" y="223" font-size="15" font-weight="600" fill="#1A2433">You</text><text x="326" y="242" font-size="13" fill="#516075">25 shares = 2.5%</text>
<text x="300" y="40" font-size="13" font-weight="700" fill="#516075" letter-spacing="0.5">1,000 SHARES IN TOTAL</text>
</svg>
