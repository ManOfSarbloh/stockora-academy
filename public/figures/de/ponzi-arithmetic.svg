<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" role="img" aria-label="Ein System mit € 100.000 von 100 Anlegern, das ohne echte Gewinne € 10.000 im Monat auszahlt, hat nach 10 Monaten nichts mehr, außer neue Anleger zahlen ein" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Ein System mit € 100.000 von 100 Anlegern, das ohne echte Gewinne € 10.000 im Monat auszahlt, hat nach 10 Monaten nichts mehr, außer neue Anleger zahlen ein</title><rect width="740" height="340" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">10 % im Monat aus dem eigenen Geld der Anleger auszahlen</text><text x="40" y="60" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">100 Personen zahlen je € 1.000 ein. Das System zahlt € 10.000 im Monat aus und verdient nichts.</text><rect x="70" y="80" width="40" height="190" rx="3" fill="#0B132B"/><text x="90" y="72" font-size="12" font-weight="700" fill="#0B132B" text-anchor="middle">€100k</text><text x="90" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">0</text><rect x="130" y="99" width="40" height="171" rx="3" fill="#3A506B"/><text x="150" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">1</text><rect x="190" y="118" width="40" height="152" rx="3" fill="#3A506B"/><text x="210" y="110" font-size="12" font-weight="700" fill="#0B132B" text-anchor="middle">€80k</text><text x="210" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">2</text><rect x="250" y="137" width="40" height="133" rx="3" fill="#3A506B"/><text x="270" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">3</text><rect x="310" y="156" width="40" height="114" rx="3" fill="#3A506B"/><text x="330" y="148" font-size="12" font-weight="700" fill="#0B132B" text-anchor="middle">€60k</text><text x="330" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">4</text><rect x="370" y="175" width="40" height="95" rx="3" fill="#3A506B"/><text x="390" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">5</text><rect x="430" y="194" width="40" height="76" rx="3" fill="#3A506B"/><text x="450" y="186" font-size="12" font-weight="700" fill="#0B132B" text-anchor="middle">€40k</text><text x="450" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">6</text><rect x="490" y="213" width="40" height="57" rx="3" fill="#3A506B"/><text x="510" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">7</text><rect x="550" y="232" width="40" height="38" rx="3" fill="#3A506B"/><text x="570" y="224" font-size="12" font-weight="700" fill="#0B132B" text-anchor="middle">€20k</text><text x="570" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">8</text><rect x="610" y="251" width="40" height="19" rx="3" fill="#3A506B"/><text x="630" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">9</text><rect x="670" y="270" width="40" height="0" rx="3" fill="#3A506B"/><text x="690" y="290" font-size="12" font-weight="500" fill="#4D5470" text-anchor="middle">10</text><line x1="60" y1="270" x2="700" y2="270" stroke="#0B132B" stroke-width="1.5" stroke-linecap="round"/><text x="380" y="312" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Monate</text><text x="676" y="252" font-size="13" font-weight="700" fill="#c8352f" text-anchor="middle">Weg</text><text x="716" y="96" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="end">Außer, neue Anleger zahlen weiter ein.</text></svg>
