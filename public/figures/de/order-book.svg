<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="Inter, system-ui, sans-serif">
<title>Beispiel eines Orderbuchs: Verkäufer (Ask) zu 10,04 Euro für 300 Aktien, 10,03 für 500, 10,02 für 200; Käufer (Bid) zu 10,00 für 400, 9,99 für 600, 9,98 für 1 000. Der Spread beträgt 0,02 Euro.</title>
<rect width="560" height="400" rx="16" fill="#ffffff"/>
<text x="28" y="36" font-size="13" font-weight="700" fill="#4D5470" letter-spacing="0.5">ORDERBUCH</text>
<text x="160" y="66" font-size="12" font-weight="600" fill="#4D5470">Preis</text><text x="260" y="66" font-size="12" font-weight="600" fill="#4D5470">Aktien</text>
<text x="28" y="128" font-size="13" font-weight="700" fill="#B4441A">Verkäufer</text><text x="28" y="146" font-size="11.5" fill="#4D5470">(Ask)</text>
<rect x="260" y="78" width="60.0" height="26" rx="4" fill="#F4C9B5"/><text x="160" y="96" font-size="14" font-weight="600" fill="#0B132B">€ 10,04</text><text x="324.0" y="96" font-size="13" fill="#0B132B">300</text>
<rect x="260" y="112" width="100.0" height="26" rx="4" fill="#F4C9B5"/><text x="160" y="130" font-size="14" font-weight="600" fill="#0B132B">€ 10,03</text><text x="364.0" y="130" font-size="13" fill="#0B132B">500</text>
<rect x="260" y="146" width="40.0" height="26" rx="4" fill="#F4C9B5"/><text x="160" y="164" font-size="14" font-weight="600" fill="#0B132B">€ 10,02</text><text x="304.0" y="164" font-size="13" fill="#0B132B">200</text>
<line x1="150" y1="186" x2="532" y2="186" stroke="#DCD2E6" stroke-dasharray="4 4"/>
<text x="532" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#55418C">Bester Ask € 10,02</text>
<text x="532" y="202" text-anchor="end" font-size="12" font-weight="600" fill="#55418C">Bester Bid € 10,00</text>
<text x="160" y="192" font-size="12" font-weight="700" fill="#4D5470">Spread € 0,02</text>
<text x="28" y="254" font-size="13" font-weight="700" fill="#55418C">Käufer</text><text x="28" y="272" font-size="11.5" fill="#4D5470">(Bid)</text>
<rect x="260" y="204" width="80.0" height="26" rx="4" fill="#E4DBEF"/><text x="160" y="222" font-size="14" font-weight="600" fill="#0B132B">€ 10,00</text><text x="344.0" y="222" font-size="13" fill="#0B132B">400</text>
<rect x="260" y="238" width="120.0" height="26" rx="4" fill="#E4DBEF"/><text x="160" y="256" font-size="14" font-weight="600" fill="#0B132B">€ 9,99</text><text x="384.0" y="256" font-size="13" fill="#0B132B">600</text>
<rect x="260" y="272" width="200.0" height="26" rx="4" fill="#E4DBEF"/><text x="160" y="290" font-size="14" font-weight="600" fill="#0B132B">€ 9,98</text><text x="464.0" y="290" font-size="13" fill="#0B132B">1 000</text>
<text x="28" y="380" font-size="11.5" fill="#4D5470">Die besten Preise stehen in der Mitte. Bei gleichem Preis kommen frühere Orders zuerst.</text>
</svg>
