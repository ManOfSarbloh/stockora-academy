<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="EU-Regeln und ESMA stehen über der FMA, der unabhängigen österreichischen Aufsicht über Banken, Versicherungen, Pensionskassen und Wertpapiere; die OeNB trägt zur Finanzstabilität bei und prüft Banken für die FMA; die FMA beaufsichtigt Banken, Versicherungen und Pensionskassen, Wertpapierfirmen, Emittenten und, im Weg der Rechtsaufsicht, die Wiener Börse" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>EU-Regeln und ESMA stehen über der FMA, der unabhängigen österreichischen Aufsicht über Banken, Versicherungen, Pensionskassen und Wertpapiere; die OeNB trägt zur Finanzstabilität bei und prüft Banken für die FMA; die FMA beaufsichtigt Banken, Versicherungen und Pensionskassen, Wertpapierfirmen, Emittenten und, im Weg der Rechtsaufsicht, die Wiener Börse</title><defs><marker id="ra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3A506B"/></marker></defs><rect width="760" height="408" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Wer den österreichischen Markt beaufsichtigt</text><rect x="40" y="56" width="680" height="62" rx="10" fill="#F3EEF8" stroke="#C8B8DB" stroke-width="1.5"/><text x="380" y="83" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Europäische Union</text><text x="380" y="101" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Regeln wie MiFID II, MAR, Prospekt-VO und PRIIPs · die ESMA koordiniert die nationalen Aufsichten</text><line x1="350" y1="122" x2="350" y2="150" stroke="#3A506B" stroke-width="2" marker-end="url(#ra)" stroke-linecap="round"/><rect x="200" y="154" width="300" height="70" rx="10" fill="#ffffff" stroke="#0B132B" stroke-width="1.5"/><text x="350" y="176" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">FMA (Finanzmarktaufsicht)</text><text x="350" y="194" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Bank-, Versicherungs-, Pensionskassen-</text><text x="350" y="212" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">und Wertpapieraufsicht; unabhängig</text><rect x="526" y="154" width="194" height="70" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="623" y="176" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">OeNB</text><text x="623" y="194" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Finanzstabilität;</text><text x="623" y="212" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Bankprüfungen für die FMA</text><line x1="504" y1="189" x2="522" y2="189" stroke="#3A506B" stroke-width="2" stroke-linecap="round"/><path d="M350 228 C350 262 104 262 104 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="104" y="335" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Banken</text><path d="M350 228 C350 262 242 262 242 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="178" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="242" y="326" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Versicherungen</text><text x="242" y="344" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">und Pensionskassen</text><path d="M350 228 C350 262 380 262 380 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="380" y="326" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Wertpapierfirmen</text><text x="380" y="344" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">und Berater</text><path d="M350 228 C350 262 518 262 518 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="454" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="518" y="317" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Emittenten</text><text x="518" y="335" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Prospekte,</text><text x="518" y="353" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Offenlegung</text><path d="M350 228 C350 262 656 262 656 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="592" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="656" y="317" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Wiener Börse</text><text x="656" y="335" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Rechtsaufsicht</text><text x="656" y="353" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">über die Börse</text><text x="40" y="390" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">Die FMA überwacht auch Marktmissbrauch (Insiderhandel, Manipulation) und veröffentlicht Warnmeldungen.</text></svg>
