<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Cómo funciona un ETF: los inversores compran y venden participaciones existentes en la bolsa todo el día; los participantes autorizados crean nuevas entregando al fondo una cesta de valores, o reembolsan participaciones a cambio de la cesta, lo que mantiene el precio cerca del valor del fondo" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Cómo funciona un ETF: los inversores compran y venden participaciones existentes en la bolsa todo el día; los participantes autorizados crean nuevas entregando al fondo una cesta de valores, o reembolsan participaciones a cambio de la cesta, lo que mantiene el precio cerca del valor del fondo</title><defs><marker id="ha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3A506B"/></marker><marker id="ht" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6A55A0"/></marker></defs><rect width="760" height="360" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Dos mercados para un ETF</text><rect x="24" y="54" width="712" height="120" rx="12" fill="rgba(106,85,160,0.06)"/><text x="40" y="76" font-size="12.5" font-weight="600" fill="#6A55A0" text-anchor="start">1 · En la bolsa, todo el día: los inversores negocian participaciones existentes entre sí</text><rect x="24" y="190" width="712" height="150" rx="12" fill="rgba(11,19,43,0.05)"/><text x="40" y="212" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">2 · Con el fondo, en grandes bloques: se crean y reembolsan participaciones</text><rect x="48" y="92" width="170" height="64" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="133" y="120" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Tú y otros</text><text x="133" y="138" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">inversores</text><rect x="296" y="92" width="170" height="64" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="381" y="120" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Bolsa</text><text x="381" y="138" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">cambian de mano</text><rect x="544" y="92" width="170" height="64" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="629" y="120" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Participante</text><text x="629" y="138" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">autorizado</text><line x1="222" y1="116" x2="290" y2="116" stroke="#6A55A0" stroke-width="2" marker-end="url(#ht)" stroke-linecap="round"/><line x1="290" y1="132" x2="222" y2="132" stroke="#6A55A0" stroke-width="2" marker-end="url(#ht)" stroke-linecap="round"/><text x="256" y="108" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="middle">comprar</text><text x="256" y="148" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="middle">vender</text><line x1="470" y1="116" x2="538" y2="116" stroke="#6A55A0" stroke-width="2" marker-end="url(#ht)" stroke-linecap="round"/><line x1="538" y1="132" x2="470" y2="132" stroke="#6A55A0" stroke-width="2" marker-end="url(#ht)" stroke-linecap="round"/><rect x="544" y="236" width="170" height="84" rx="10" fill="#ffffff" stroke="#0B132B" stroke-width="1.5"/><text x="629" y="265" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">ETF (el fondo)</text><text x="629" y="283" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">tiene una cesta de</text><text x="629" y="301" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">acciones o bonos</text><line x1="600" y1="160" x2="600" y2="230" stroke="#3A506B" stroke-width="2" marker-end="url(#ha)" stroke-linecap="round"/><line x1="660" y1="230" x2="660" y2="160" stroke="#3A506B" stroke-width="2" marker-end="url(#ha)" stroke-linecap="round"/><text x="530" y="254" font-size="12.5" font-weight="700" fill="#3A506B" text-anchor="end">Creación ↓</text><text x="530" y="270" font-size="12" font-weight="500" fill="#4D5470" text-anchor="end">entra la cesta, salen participaciones</text><text x="530" y="294" font-size="12.5" font-weight="700" fill="#3A506B" text-anchor="end">Reembolso ↑</text><text x="530" y="310" font-size="12" font-weight="500" fill="#4D5470" text-anchor="end">entran participaciones, sale la cesta</text><text x="40" y="252" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">El arbitraje de los participantes</text><text x="40" y="270" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">autorizados mantiene el precio</text><text x="40" y="288" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">cerca de su valor (NAV)</text></svg>
