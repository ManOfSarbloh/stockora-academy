<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Con 1000 € propios: una caída del precio del 20 % cuesta 20 % sin apalancamiento pero 100 % con 5:1; una caída del 10 % cuesta 10 % o 50 %; una subida del 10 % gana 10 % o 50 %" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Con 1000 € propios: una caída del precio del 20 % cuesta 20 % sin apalancamiento pero 100 % con 5:1; una caída del 10 % cuesta 10 % o 50 %; una subida del 10 % gana 10 % o 50 %</title><rect width="720" height="330" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Tus 1000 €, con y sin apalancamiento 5:1</text><rect x="40" y="53" width="14" height="14" rx="3" fill="#C8B8DB"/><text x="62" y="64" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Sin apalancamiento (posición de 1000 €)</text><rect x="330" y="53" width="14" height="14" rx="3" fill="#0B132B"/><text x="352" y="64" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Con 5:1 (posición de 5000 €)</text><text x="40" y="130" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Precio −20 %</text><rect x="382" y="100" width="48" height="22" rx="4" fill="#C8B8DB"/><text x="374" y="116" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="end">−20 % (−200 €)</text><rect x="190" y="126" width="240" height="22" rx="4" fill="#0B132B"/><text x="198" y="142" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start">−100 % (−1000 €)</text><text x="40" y="200" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Precio −10 %</text><rect x="406" y="170" width="24" height="22" rx="4" fill="#C8B8DB"/><text x="398" y="186" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="end">−10 % (−100 €)</text><rect x="310" y="196" width="120" height="22" rx="4" fill="#0B132B"/><text x="302" y="212" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="end">−50 % (−500 €)</text><text x="40" y="270" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">Precio +10 %</text><rect x="430" y="240" width="24" height="22" rx="4" fill="#C8B8DB"/><text x="462" y="256" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="start">+10 % (+100 €)</text><rect x="430" y="266" width="120" height="22" rx="4" fill="#0B132B"/><text x="558" y="282" font-size="12.5" font-weight="700" fill="#16834a" text-anchor="start">+50 % (+500 €)</text><line x1="430" y1="92" x2="430" y2="310" stroke="#0B132B" stroke-width="1.5" stroke-linecap="round"/><text x="680" y="316" font-size="12.5" font-weight="700" fill="#c8352f" text-anchor="end">Con 5:1, una caída del 20 % borra toda la inversión.</text></svg>
