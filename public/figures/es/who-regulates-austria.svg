<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="Las normas de la UE y la ESMA están por encima de la FMA, el supervisor independiente austriaco de banca, seguros, fondos de pensiones y valores; el OeNB contribuye a la estabilidad financiera e inspecciona bancos para la FMA; la FMA supervisa bancos, aseguradoras y fondos de pensiones, empresas de inversión, emisores y, mediante supervisión legal, la Wiener Börse" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Las normas de la UE y la ESMA están por encima de la FMA, el supervisor independiente austriaco de banca, seguros, fondos de pensiones y valores; el OeNB contribuye a la estabilidad financiera e inspecciona bancos para la FMA; la FMA supervisa bancos, aseguradoras y fondos de pensiones, empresas de inversión, emisores y, mediante supervisión legal, la Wiener Börse</title><defs><marker id="ra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3A506B"/></marker></defs><rect width="760" height="408" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Quién vigila el mercado austriaco</text><rect x="40" y="56" width="680" height="62" rx="10" fill="#F3EEF8" stroke="#C8B8DB" stroke-width="1.5"/><text x="380" y="83" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Unión Europea</text><text x="380" y="101" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Normas como MiFID II, MAR, el Reglamento de Folletos y PRIIPs · la ESMA coordina a los supervisores</text><line x1="350" y1="122" x2="350" y2="150" stroke="#3A506B" stroke-width="2" marker-end="url(#ra)" stroke-linecap="round"/><rect x="200" y="154" width="300" height="70" rx="10" fill="#ffffff" stroke="#0B132B" stroke-width="1.5"/><text x="350" y="176" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">FMA (Finanzmarktaufsicht)</text><text x="350" y="194" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Supervisión de banca, seguros, pensiones</text><text x="350" y="212" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">y valores; independiente</text><rect x="526" y="154" width="194" height="70" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="623" y="176" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">OeNB</text><text x="623" y="194" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Estabilidad financiera;</text><text x="623" y="212" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">inspecciona bancos para la FMA</text><line x1="504" y1="189" x2="522" y2="189" stroke="#3A506B" stroke-width="2" stroke-linecap="round"/><path d="M350 228 C350 262 104 262 104 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="104" y="335" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Bancos</text><path d="M350 228 C350 262 242 262 242 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="178" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="242" y="326" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Aseguradoras y</text><text x="242" y="344" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">fondos de pensiones</text><path d="M350 228 C350 262 380 262 380 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="380" y="326" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Empresas de</text><text x="380" y="344" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">inversión y asesores</text><path d="M350 228 C350 262 518 262 518 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="454" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="518" y="317" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Emisores</text><text x="518" y="335" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">folletos,</text><text x="518" y="353" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">información</text><path d="M350 228 C350 262 656 262 656 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="592" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="656" y="317" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Wiener Börse</text><text x="656" y="335" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">supervisión legal</text><text x="656" y="353" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">de la bolsa</text><text x="40" y="390" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">La FMA también vigila el abuso de mercado (información privilegiada, manipulación) y publica advertencias.</text></svg>
