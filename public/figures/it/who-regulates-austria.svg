<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="Le regole UE e l'ESMA stanno sopra la FMA, autorità austriaca indipendente di vigilanza su banche, assicurazioni, fondi pensione e titoli; l'OeNB contribuisce alla stabilità finanziaria e ispeziona le banche per la FMA; la FMA vigila su banche, assicurazioni e fondi pensione, imprese di investimento, emittenti e, con un controllo di legittimità, sulla Wiener Börse" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Le regole UE e l'ESMA stanno sopra la FMA, autorità austriaca indipendente di vigilanza su banche, assicurazioni, fondi pensione e titoli; l'OeNB contribuisce alla stabilità finanziaria e ispeziona le banche per la FMA; la FMA vigila su banche, assicurazioni e fondi pensione, imprese di investimento, emittenti e, con un controllo di legittimità, sulla Wiener Börse</title><defs><marker id="ra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3A506B"/></marker></defs><rect width="760" height="408" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Chi vigila sul mercato austriaco</text><rect x="40" y="56" width="680" height="62" rx="10" fill="#F3EEF8" stroke="#C8B8DB" stroke-width="1.5"/><text x="380" y="83" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Unione europea</text><text x="380" y="101" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Regole come MiFID II, MAR, il Regolamento Prospetto e PRIIPs · l'ESMA coordina le autorità nazionali</text><line x1="350" y1="122" x2="350" y2="150" stroke="#3A506B" stroke-width="2" marker-end="url(#ra)" stroke-linecap="round"/><rect x="200" y="154" width="300" height="70" rx="10" fill="#ffffff" stroke="#0B132B" stroke-width="1.5"/><text x="350" y="176" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">FMA (Finanzmarktaufsicht)</text><text x="350" y="194" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Vigilanza su banche, assicurazioni,</text><text x="350" y="212" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">pensioni e titoli; indipendente</text><rect x="526" y="154" width="194" height="70" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="623" y="176" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">OeNB</text><text x="623" y="194" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">Stabilità finanziaria;</text><text x="623" y="212" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">ispezioni bancarie per la FMA</text><line x1="504" y1="189" x2="522" y2="189" stroke="#3A506B" stroke-width="2" stroke-linecap="round"/><path d="M350 228 C350 262 104 262 104 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="104" y="335" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Banche</text><path d="M350 228 C350 262 242 262 242 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="178" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="242" y="326" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Assicurazioni e</text><text x="242" y="344" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">fondi pensione</text><path d="M350 228 C350 262 380 262 380 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="380" y="326" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Imprese di</text><text x="380" y="344" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">investimento</text><path d="M350 228 C350 262 518 262 518 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="454" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="518" y="317" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Emittenti</text><text x="518" y="335" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">prospetti,</text><text x="518" y="353" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">informativa</text><path d="M350 228 C350 262 656 262 656 290" fill="none" stroke="#3A506B" stroke-width="1.6" marker-end="url(#ra)" stroke-linecap="round" stroke-linejoin="round"/><rect x="592" y="294" width="128" height="72" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="656" y="317" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Wiener Börse</text><text x="656" y="335" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">controllo di legittimità</text><text x="656" y="353" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">sulla borsa</text><text x="40" y="390" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">La FMA vigila anche sugli abusi di mercato (insider trading, manipolazione) e pubblica avvertenze.</text></svg>
