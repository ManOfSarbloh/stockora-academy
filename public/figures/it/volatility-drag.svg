<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="Freno della volatilità: 1000 € salgono del 50% a 1500 € e poi scendono del 50% a 750 €; la media dei due rendimenti è 0% ma il risultato reale è −25%" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Freno della volatilità: 1000 € salgono del 50% a 1500 € e poi scendono del 50% a 750 €; la media dei due rendimenti è 0% ma il risultato reale è −25%</title><rect width="700" height="330" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">+50% e poi −50% non ti riporta al punto di partenza</text><line x1="70" y1="140" x2="520" y2="140" stroke="#0B132B" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><text x="526" y="144" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">Partenza: 1000 €</text><rect x="100" y="140" width="90" height="130" rx="5" fill="#3A506B"/><text x="145" y="130" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">1000 €</text><text x="145" y="294" font-size="13" font-weight="600" fill="#4D5470" text-anchor="middle">Partenza</text><rect x="240" y="75" width="90" height="195" rx="5" fill="#16834a"/><text x="285" y="65" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">1500 €</text><text x="285" y="294" font-size="13" font-weight="600" fill="#4D5470" text-anchor="middle">Dopo +50%</text><rect x="380" y="172.5" width="90" height="97.5" rx="5" fill="#c8352f"/><text x="425" y="162.5" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">750 €</text><text x="425" y="294" font-size="13" font-weight="600" fill="#4D5470" text-anchor="middle">Poi −50%</text><line x1="70" y1="270" x2="520" y2="270" stroke="#0B132B" stroke-width="1.5" stroke-linecap="round"/><rect x="530" y="160" width="150" height="92" rx="10" fill="#F3EEF8" stroke="#C8B8DB" stroke-width="1.5"/><text x="545" y="186" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Media dei</text><text x="545" y="204" font-size="12.5" font-weight="700" fill="#0B132B" text-anchor="start">due rendimenti: 0%</text><text x="545" y="230" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">Risultato:</text><text x="545" y="246" font-size="14" font-weight="700" fill="#c8352f" text-anchor="start">−25%</text></svg>
