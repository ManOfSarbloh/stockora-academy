<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Comment fonctionne un ETF : les investisseurs achètent et vendent des parts existantes en Bourse toute la journée ; les participants agréés créent de nouvelles parts en livrant au fonds un panier de titres, ou rachètent des parts contre le panier, ce qui garde le prix proche de la valeur du fonds" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Comment fonctionne un ETF : les investisseurs achètent et vendent des parts existantes en Bourse toute la journée ; les participants agréés créent de nouvelles parts en livrant au fonds un panier de titres, ou rachètent des parts contre le panier, ce qui garde le prix proche de la valeur du fonds</title><defs><marker id="ha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3A506B"/></marker><marker id="ht" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6A55A0"/></marker></defs><rect width="760" height="360" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Deux marchés pour un ETF</text><rect x="24" y="54" width="712" height="120" rx="12" fill="rgba(106,85,160,0.06)"/><text x="40" y="76" font-size="12.5" font-weight="600" fill="#6A55A0" text-anchor="start">1 · En Bourse, toute la journée : les investisseurs s’échangent des parts existantes</text><rect x="24" y="190" width="712" height="150" rx="12" fill="rgba(11,19,43,0.05)"/><text x="40" y="212" font-size="12.5" font-weight="600" fill="#0B132B" text-anchor="start">2 · Avec le fonds, par gros blocs : des parts sont créées et rachetées</text><rect x="48" y="92" width="170" height="64" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="133" y="120" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Vous et d’autres</text><text x="133" y="138" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">investisseurs</text><rect x="296" y="92" width="170" height="64" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="381" y="120" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Bourse</text><text x="381" y="138" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">les parts changent de main</text><rect x="544" y="92" width="170" height="64" rx="10" fill="#ffffff" stroke="#C8B8DB" stroke-width="1.5"/><text x="629" y="120" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">Participant</text><text x="629" y="138" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">agréé</text><line x1="222" y1="116" x2="290" y2="116" stroke="#6A55A0" stroke-width="2" marker-end="url(#ht)" stroke-linecap="round"/><line x1="290" y1="132" x2="222" y2="132" stroke="#6A55A0" stroke-width="2" marker-end="url(#ht)" stroke-linecap="round"/><text x="256" y="108" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="middle">achat</text><text x="256" y="148" font-size="11.5" font-weight="500" fill="#4D5470" text-anchor="middle">vente</text><line x1="470" y1="116" x2="538" y2="116" stroke="#6A55A0" stroke-width="2" marker-end="url(#ht)" stroke-linecap="round"/><line x1="538" y1="132" x2="470" y2="132" stroke="#6A55A0" stroke-width="2" marker-end="url(#ht)" stroke-linecap="round"/><rect x="544" y="236" width="170" height="84" rx="10" fill="#ffffff" stroke="#0B132B" stroke-width="1.5"/><text x="629" y="265" font-size="14" font-weight="700" fill="#0B132B" text-anchor="middle">ETF (le fonds)</text><text x="629" y="283" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">détient un panier</text><text x="629" y="301" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="middle">d’actions ou d’obligations</text><line x1="600" y1="160" x2="600" y2="230" stroke="#3A506B" stroke-width="2" marker-end="url(#ha)" stroke-linecap="round"/><line x1="660" y1="230" x2="660" y2="160" stroke="#3A506B" stroke-width="2" marker-end="url(#ha)" stroke-linecap="round"/><text x="530" y="254" font-size="12.5" font-weight="700" fill="#3A506B" text-anchor="end">Création ↓</text><text x="530" y="270" font-size="12" font-weight="500" fill="#4D5470" text-anchor="end">panier entre, parts sortent</text><text x="530" y="294" font-size="12.5" font-weight="700" fill="#3A506B" text-anchor="end">Rachat ↑</text><text x="530" y="310" font-size="12" font-weight="500" fill="#4D5470" text-anchor="end">parts entrent, panier sort</text><text x="40" y="252" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">L’arbitrage des participants</text><text x="40" y="270" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">agréés garde le prix de l’ETF</text><text x="40" y="288" font-size="12" font-weight="500" fill="#4D5470" text-anchor="start">proche de sa valeur (VL)</text></svg>
