<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Une ligne de cotation fictive : Alpenrad AG, Prime Market, plus haut 31,40, plus bas 30,10, clôture 30,20 eD, −3,8 %, volume 182 000, capitaux 5,5 € millions ; eD signifie ex-dividende, l’essentiel de la baisse est donc le détachement du dividende de 1,10 €" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Une ligne de cotation fictive : Alpenrad AG, Prime Market, plus haut 31,40, plus bas 30,10, clôture 30,20 eD, −3,8 %, volume 182 000, capitaux 5,5 € millions ; eD signifie ex-dividende, l’essentiel de la baisse est donc le détachement du dividende de 1,10 €</title><rect width="760" height="300" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Lire une ligne de cotation (exemple fictif)</text><rect x="36" y="64" width="688" height="52" rx="8" fill="#F3EEF8" stroke="#C8B8DB" stroke-width="1.5"/><text x="48" y="96" font-size="14" font-weight="700" fill="#0B132B" text-anchor="start">Alpenrad AG</text><line x1="103" y1="110" x2="103" y2="136" stroke="#C8B8DB" stroke-width="1.2" stroke-linecap="round"/><text x="103" y="150" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="middle">Nom</text><text x="182" y="96" font-size="14" font-weight="700" fill="#0B132B" text-anchor="start">Prime Market</text><line x1="228" y1="110" x2="228" y2="180" stroke="#C8B8DB" stroke-width="1.2" stroke-linecap="round"/><text x="228" y="194" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="middle">Segment</text><text x="298" y="96" font-size="14" font-weight="700" fill="#0B132B" text-anchor="start">31,40 / 30,10 / 30,20 eD</text><line x1="385" y1="110" x2="385" y2="136" stroke="#C8B8DB" stroke-width="1.2" stroke-linecap="round"/><text x="385" y="150" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="middle">Haut / bas / clôture</text><text x="496" y="96" font-size="14" font-weight="700" fill="#c8352f" text-anchor="start">−3,8 %</text><line x1="523" y1="110" x2="523" y2="180" stroke="#C8B8DB" stroke-width="1.2" stroke-linecap="round"/><text x="523" y="194" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="middle">Variation du jour</text><text x="574" y="96" font-size="14" font-weight="700" fill="#0B132B" text-anchor="start">182 000</text><line x1="608" y1="110" x2="608" y2="136" stroke="#C8B8DB" stroke-width="1.2" stroke-linecap="round"/><text x="608" y="150" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="middle">Volume (titres)</text><text x="666" y="96" font-size="14" font-weight="700" fill="#0B132B" text-anchor="start">5,5 € m</text><line x1="696" y1="110" x2="696" y2="180" stroke="#C8B8DB" stroke-width="1.2" stroke-linecap="round"/><text x="696" y="194" font-size="12.5" font-weight="600" fill="#4D5470" text-anchor="middle">Capitaux (valeur)</text><rect x="40" y="226" width="680" height="54" rx="10" fill="#ffffff" stroke="#c98500" stroke-width="1.5"/><text x="56" y="248" font-size="13" font-weight="700" fill="#0B132B" text-anchor="start">« eD » = ex-dividende : un dividende de 1,10 € a été déduit du cours ce jour-là.</text><text x="56" y="268" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">L’essentiel des −3,8 % est le dividende, pas une perte pour les actionnaires.</text></svg>
