<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Inter, system-ui, sans-serif">
<title>Graphique circulaire : une société de 1 000 actions détenues par un fondateur (40 %), un fonds de pension (30 %), de nombreux petits investisseurs (27,5 %) et vous (25 actions, 2,5 %)</title>
<rect width="520" height="300" rx="16" fill="#ffffff"/>
<path d="M150.00 150.00 L150.00 40.00 A110 110 0 0 1 214.66 238.99 Z" fill="#0B132B" stroke="#ffffff" stroke-width="2"/><path d="M150.00 150.00 L214.66 238.99 A110 110 0 0 1 45.38 183.99 Z" fill="#3A506B" stroke="#ffffff" stroke-width="2"/><path d="M150.00 150.00 L45.38 183.99 A110 110 0 0 1 132.79 41.35 Z" fill="#C8B8DB" stroke="#ffffff" stroke-width="2"/><path d="M149.22 140.03 L132.01 31.39 A110 110 0 0 1 149.22 30.03 Z" fill="#6A55A0" stroke="#ffffff" stroke-width="2"/>
<rect x="300" y="66" width="16" height="16" rx="4" fill="#0B132B"/><text x="326" y="79" font-size="15" font-weight="600" fill="#0B132B">Un fondateur</text><text x="326" y="98" font-size="13" fill="#4D5470">400 actions = 40 %</text><rect x="300" y="114" width="16" height="16" rx="4" fill="#3A506B"/><text x="326" y="127" font-size="15" font-weight="600" fill="#0B132B">Un fonds de pension</text><text x="326" y="146" font-size="13" fill="#4D5470">300 actions = 30 %</text><rect x="300" y="162" width="16" height="16" rx="4" fill="#C8B8DB"/><text x="326" y="175" font-size="15" font-weight="600" fill="#0B132B">Petits investisseurs</text><text x="326" y="194" font-size="13" fill="#4D5470">275 actions = 27,5 %</text><rect x="300" y="210" width="16" height="16" rx="4" fill="#6A55A0"/><text x="326" y="223" font-size="15" font-weight="600" fill="#0B132B">Vous</text><text x="326" y="242" font-size="13" fill="#4D5470">25 actions = 2,5 %</text>
<text x="300" y="40" font-size="13" font-weight="700" fill="#4D5470" letter-spacing="0.5">1 000 ACTIONS AU TOTAL</text>
</svg>
