<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" role="img" aria-label="Tendance haussière avec plus hauts et plus bas croissants, baissière avec plus hauts et plus bas décroissants, et un range latéral entre zones de support et de résistance" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Tendance haussière avec plus hauts et plus bas croissants, baissière avec plus hauts et plus bas décroissants, et un range latéral entre zones de support et de résistance</title><rect width="780" height="260" rx="12" fill="#ffffff"/><text x="135" y="24" font-size="13" font-weight="600" fill="#1a2433" text-anchor="middle">Tendance haussière</text><polyline points="20,206 58.3,143 96.7,170 135,107 173.3,134 211.7,71 250,98" fill="none" stroke="#1a2433" stroke-width="2" stroke-linejoin="round"/><text x="58.3" y="133" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">H</text><text x="96.7" y="160" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">HL</text><text x="135" y="97" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">HH</text><text x="173.3" y="124" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">HL</text><text x="211.7" y="61" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">HH</text><text x="250" y="88" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">HL</text><text x="390" y="24" font-size="13" font-weight="600" fill="#1a2433" text-anchor="middle">Tendance baissière</text><polyline points="275,62 313.3,125 351.7,98 390,161 428.3,134 466.7,197 505,170" fill="none" stroke="#1a2433" stroke-width="2" stroke-linejoin="round"/><text x="313.3" y="147" font-size="12" font-weight="700" fill="#c8352f" text-anchor="middle">L</text><text x="351.7" y="88" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">LH</text><text x="390" y="183" font-size="12" font-weight="700" fill="#c8352f" text-anchor="middle">LL</text><text x="428.3" y="124" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">LH</text><text x="466.7" y="219" font-size="12" font-weight="700" fill="#c8352f" text-anchor="middle">LL</text><text x="505" y="160" font-size="12" font-weight="700" fill="#16834a" text-anchor="middle">LH</text><text x="645" y="24" font-size="13" font-weight="600" fill="#1a2433" text-anchor="middle">Range (latéral)</text><rect x="530" y="76.4" width="230" height="21.6" fill="rgba(42,120,214,0.12)"/><text x="756" y="91.2" font-size="11" font-weight="600" fill="#2a78d6" text-anchor="end">Zone de résistance</text><rect x="530" y="166.4" width="230" height="21.6" fill="rgba(42,120,214,0.12)"/><text x="756" y="181.2" font-size="11" font-weight="600" fill="#2a78d6" text-anchor="end">Zone de support</text><polyline points="530,170 568.3,89 606.7,179 645,83.6 683.3,173.6 721.7,90.8 760,134" fill="none" stroke="#1a2433" stroke-width="2" stroke-linejoin="round"/><text x="390" y="250" font-size="12" font-weight="500" fill="#516075" text-anchor="middle">HH = plus haut croissant, HL = plus bas croissant, LH = plus haut décroissant, LL = plus bas décroissant</text></svg>
