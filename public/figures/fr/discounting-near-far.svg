<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Valeur actuelle de 100 € : versés dans 1 an, ils valent 96,15 € à 4 % et 94,34 € à 6 % (environ −2 %) ; versés dans 20 ans, ils valent 45,64 € à 4 % et 31,18 € à 6 % (environ −32 %)" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><title>Valeur actuelle de 100 € : versés dans 1 an, ils valent 96,15 € à 4 % et 94,34 € à 6 % (environ −2 %) ; versés dans 20 ans, ils valent 45,64 € à 4 % et 31,18 € à 6 % (environ −32 %)</title><rect width="720" height="330" rx="14" fill="#ffffff"/><text x="40" y="36" font-size="16" font-weight="700" fill="#0B132B" text-anchor="start">Ce que valent aujourd’hui 100 € futurs</text><rect x="430" y="23" width="14" height="14" rx="3" fill="#3A506B"/><text x="452" y="34" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">avec un taux d’actualisation de 4 %</text><rect x="430" y="45" width="14" height="14" rx="3" fill="#0B132B"/><text x="452" y="56" font-size="12.5" font-weight="500" fill="#4D5470" text-anchor="start">avec un taux d’actualisation de 6 %</text><line x1="70" y1="260" x2="680" y2="260" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="62" y="264" font-size="12" font-weight="500" fill="#4D5470" text-anchor="end">0 €</text><line x1="70" y1="175" x2="680" y2="175" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="62" y="179" font-size="12" font-weight="500" fill="#4D5470" text-anchor="end">50 €</text><line x1="70" y1="90" x2="680" y2="90" stroke="#e3e8ee" stroke-width="1" stroke-linecap="round"/><text x="62" y="94" font-size="12" font-weight="500" fill="#4D5470" text-anchor="end">100 €</text><rect x="130" y="96.5" width="80" height="163.5" rx="4" fill="#3A506B"/><text x="170" y="88.5" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">96,15 €</text><rect x="222" y="99.6" width="80" height="160.4" rx="4" fill="#0B132B"/><text x="262" y="91.6" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">94,34 €</text><text x="216" y="284" font-size="13" font-weight="600" fill="#4D5470" text-anchor="middle">Société A : 100 € dans 1 an</text><text x="216" y="306" font-size="13" font-weight="700" fill="#c8352f" text-anchor="middle">Taux plus élevé : −2 %</text><rect x="420" y="182.4" width="80" height="77.6" rx="4" fill="#3A506B"/><text x="460" y="174.4" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">45,64 €</text><rect x="512" y="207" width="80" height="53" rx="4" fill="#0B132B"/><text x="552" y="199" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">31,18 €</text><text x="506" y="284" font-size="13" font-weight="600" fill="#4D5470" text-anchor="middle">Société B : 100 € dans 20 ans</text><text x="506" y="306" font-size="13" font-weight="700" fill="#c8352f" text-anchor="middle">Taux plus élevé : −32 %</text></svg>
